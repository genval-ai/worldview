name: Guards

# Checks that refuse a change before it can break a published version. Runs on every pull request,
# and the publish workflow calls it before it builds anything. Both are the CLI's own.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the pinned kanonak tooling
        working-directory: .github/kanonak
        run: |
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      # An import of a version that exists nowhere fails here, since validate reads each import at the
      # newest version its range admits.
      - name: Validate packages
        run: |
          set -euo pipefail
          find kanonak-packages/worldview.genval.ai -name '*.kan.yml' -print0 | \
            xargs -0 -P 4 -I {} kanonak validate "{}"

      # A version the origin serves that the workspace drops or changes fails here, named. validate can't
      # catch a drop, since it reads a version the workspace lacks from the origin.
      - name: Published versions are never deleted or changed
        run: kanonak publish --workspace kanonak-packages/worldview.genval.ai --check
