name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  guards:
    uses: ./.github/workflows/guards.yml

  build:
    needs: guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The exact CLI comes from .github/kanonak's lockfile, so a new release
      # can't change this workflow without a commit. The guards validated
      # every package before this job started.
      - name: Install the pinned kanonak tooling
        working-directory: .github/kanonak
        run: |
          npm ci --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Publish resources via the look layer
        run: |
          kanonak publish \
            --workspace kanonak-packages/worldview.genval.ai \
            --out _site

      - name: Add GitHub Pages host specifics
        # `kanonak publish` already emits the publisher endpoints —
        # index.txt, .well-known/kanonak.json, and the raw
        # {package}/{version}.kan.yml sources that HTTP import resolution
        # and `kanonak install` fetch. Only the GitHub-Pages host
        # specifics remain: the custom domain, and .nojekyll so Pages
        # serves the tree verbatim (preserving .well-known/ and any
        # underscore paths rather than running Jekyll over them).
        run: |
          echo "worldview.genval.ai" > _site/CNAME
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
