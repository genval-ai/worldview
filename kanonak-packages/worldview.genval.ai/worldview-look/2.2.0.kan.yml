          tx.stringLiteral: "</text>"
  derivation.look:
    type: look.ResourceView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
        look.eyebrow: wv.observedAt
      - type: look.Diagram
        look.figureTitle: "Theses in this snapshot, edge weight = confidence"
        look.placement: floatRight
        look.width: "40%"
        look.facets:
          - look.relation: wv.hasThesis
            look.encode: look.connector
            look.nodeTier: chip
            look.edgeValue:
              type: tx.PropertyRead
              tx.readProp: rdfs.label
              tx.readSource: { type: tx.VarRef, tx.varName: input }
            look.channels:
              - look.mapPath:
                  type: tx.PropertyRead
                  tx.readProp: est.estimateMean
                  tx.readSource:
                    type: tx.PropertyRead
                    tx.readProp: wv.confidence
                    tx.readSource: { type: tx.VarRef, tx.varName: input }
                look.to: thickness
      - type: look.Markdown
        look.source: wv.narrative
      - type: look.ResourceGrid
        look.source: wv.hasThesis

snap.snapshots:
  derivation.look:
    type: look.PackageView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
      - type: look.Timeline
        look.source: wv.WorldviewSnapshot
        look.orderBy: wv.observedAt
        look.track: wv.hasThesis
        look.metricPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateMean
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: wv.confidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.hueBy:
          type: tx.Traverse
          tx.traverseSource: { type: tx.VarRef, tx.varName: input }
          tx.through: vis.thesisTheme
          tx.step:
            type: tx.PropertyRead
            tx.readProp: vis.themeHue
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.valueLabel: "μ"
        look.axisMin: 0
        look.axisMax: 1
        look.lowerPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateLower95
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: wv.confidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.upperPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateUpper95
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: wv.confidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
      - type: look.VersionDiff
        look.source: wv.WorldviewSnapshot
        look.orderBy: wv.observedAt
        look.track: wv.hasThesis
        look.metricPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateMean
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: wv.confidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.hueBy:
          type: tx.Traverse
          tx.traverseSource: { type: tx.VarRef, tx.varName: input }
          tx.through: vis.thesisTheme
          tx.step:
            type: tx.PropertyRead
            tx.readProp: vis.themeHue
            tx.readSource: { type: tx.VarRef, tx.varName: input }

# ============================================================================
# Alignment + Fund analysis views (added in 2.1.0)
# Render the public thesis-alignment and fund layers consistently with how
# WorldviewThesis renders its confidence distribution and nested lists.
# ============================================================================

align.Alignment:
  derivation.look:
    type: look.ResourceView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
        look.eyebrow: rdfs.type
      - type: look.Markdown
        look.source: align.alignmentNarrative
      - type: look.SectionHeading
        look.heading: "Thesis alignments"
        look.note: "Each active thesis mapped to its ranked candidate securities."
      - type: look.ResourceGrid
        look.source: align.hasAlignment
      - type: look.Details
        look.skip:
          - align.alignmentNarrative

align.ThesisAlignment:
  derivation.look:
    type: look.ResourceView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
        look.eyebrow: rdfs.type
      - type: look.SectionHeading
        look.heading: "Mapping confidence"
        look.note: "The skill's conviction in this thesis-to-securities mapping — independent of the thesis's own confidence."
      - type: look.Distribution
        look.alphaPath:
          type: tx.PropertyRead
          tx.readProp: est.betaAlpha
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: align.alignmentConfidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.betaPath:
          type: tx.PropertyRead
          tx.readProp: est.betaBeta
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: align.alignmentConfidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.metricPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateMean
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: align.alignmentConfidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
      - type: look.Markdown
        look.source: align.alignmentRationale
      - type: look.SectionHeading
        look.heading: "Aligned securities"
        look.note: "Ranked candidates, highest structural fit first."
      - type: look.EmbeddedViews
        look.source: align.hasAlignedSecurity

align.AlignedSecurity:
  derivation.look:
    type: look.ResourceView
    look.bands:
      - type: look.Hero
        look.title: align.alignedSecurity
        look.eyebrow: rdfs.type
      - type: look.SectionHeading
        look.heading: "Alignment strength"
        look.note: "How strongly this security participates if the thesis fully plays out."
      - type: look.Distribution
        look.alphaPath:
          type: tx.PropertyRead
          tx.readProp: est.betaAlpha
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: align.alignmentStrength
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.betaPath:
          type: tx.PropertyRead
          tx.readProp: est.betaBeta
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: align.alignmentStrength
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.metricPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateMean
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: align.alignmentStrength
            tx.readSource: { type: tx.VarRef, tx.varName: input }
      - type: look.Markdown
        look.source: align.securityRationale
      - type: look.Details
        look.skip:
          - align.securityRationale

fund.Fund:
  derivation.look:
    type: look.ResourceView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
        look.eyebrow: rdfs.type
      - type: look.StatRow
        look.stats:
          - look.statLabel: "gross"
            look.statPath:
              type: tx.NumberFormat
              tx.numberStyle: percent
              tx.fractionDigits: 2
              tx.numberSource:
                type: tx.PropertyRead
                tx.readProp: fund.grossExposure
                tx.readSource: { type: tx.VarRef, tx.varName: input }
          - look.statLabel: "net"
            look.statPath:
              type: tx.NumberFormat
              tx.numberStyle: percent
              tx.fractionDigits: 2
              tx.numberSource:
                type: tx.PropertyRead
                tx.readProp: fund.netExposure
                tx.readSource: { type: tx.VarRef, tx.varName: input }
          - look.statLabel: "cash"
            look.statPath:
              type: tx.NumberFormat
              tx.numberStyle: percent
              tx.fractionDigits: 2
              tx.numberSource:
                type: tx.PropertyRead
                tx.readProp: fund.cashWeight
                tx.readSource: { type: tx.VarRef, tx.varName: input }
      - type: look.Diagram
        look.figureTitle: "The book - edge weight = target weight, colour = direction"
        look.placement: floatRight
        look.width: "40%"
        look.facets:
          - look.relation: fund.hasHolding
            look.encode: look.connector
            look.nodeTier: chip
            look.edgeValue:
              type: tx.NumberFormat
              tx.numberStyle: percent
              tx.fractionDigits: 2
              tx.numberSource:
                type: tx.PropertyRead
                tx.readProp: fund.targetWeight
                tx.readSource: { type: tx.VarRef, tx.varName: input }
            look.channels:
              - look.mapPath:
                  type: tx.PropertyRead
                  tx.readProp: fund.targetWeight
                  tx.readSource: { type: tx.VarRef, tx.varName: input }
                look.to: thickness
      - type: look.Markdown
        look.source: fund.fundNarrative
      - type: look.SectionHeading
        look.heading: "Holdings"
        look.note: "Signed target weights as a fraction of NAV. Green is long, red is short; the bar under each weight is centred on zero."
      - type: look.Diagram
        look.facets:
          - look.relation: fund.hasHolding
            look.encode: look.cluster
            look.nodeTier: card
      - type: look.Details
        look.skip:
          - fund.fundNarrative
          - fund.grossExposure
          - fund.netExposure
          - fund.cashWeight

