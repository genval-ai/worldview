# ============================================================================
# The funds package as a rebalance history (added in 2.2.0)
# One line per position across every fund version - the same Timeline +
# VersionDiff pairing snap.snapshots uses for thesis confidence, pointed at
# target weight instead. Weights are signed and the axis is left to autoscale,
# so the short book plots alongside the long one.
# ============================================================================

wfund.funds:
  derivation.look:
    type: look.PackageView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
        look.subtitle: rdfs.comment
      - type: look.SectionHeading
        look.heading: "Position weights across rebalances"
        look.note: "Every holding signed target weight, version by version. One line per position."
      - type: look.Timeline
        look.source: fund.Fund
