worldview-look:
  type: Package
  publisher: worldview.genval.ai
  version: 2.2.0
  label: Worldview Look
  comment: >-
    Declarative visual presentation for worldview.genval.ai classes.
    2.2.0 makes the FUND layer first-class. fund.Holding gains a real
    visual identity - a four-tier semanticSvg position card carrying the
    ticker, the signed weight and a zero-centred weight bar - plus display
    lenses, so a holding reads as a position everywhere it appears instead
    of as the bare slug `holding-uso`. fund.Fund gains an exposure StatRow
    and a weight-proportional holdings diagram; fund.Holding gains a
    VersionDelta against the prior fund version and a serves-thesis
    diagram. A new PackageView on the funds package plots every position's
    target weight across fund versions (Timeline) and breaks it down per
    position (VersionDiff) - the rebalance history as a chart. Also fixes
    a duplication bug carried since 2.1.0: the trailing Details band on the
    fund and alignment views re-rendered the narrative / rationale prose a
    second time as raw markdown source with [[refs]] unresolved; each now
    skips the property its Markdown band already renders.
    Sets publisher brand tokens on rdfs.Resource and declares
    derivation.look bands for WorldviewThesis, Evidence, Source,
    fin.Security, and reg.Regime. 2.0.0 migrated to look@2.0.0: every
    band path carrier (metricPath, alphaPath, betaPath, lowerPath,
    upperPath, hueBy, laneBy, labelPath, mapPath, edgeValue) is now a
    typed tx.Expression instead of a /-separated path string — embedded
    estimate fields read via nested tx.PropertyRead, reference steps via
    tx.Traverse — so every step resolves through the object model and is
    validated at author time. The look-styles import is dropped; the
    look@2.0.0 chain styles via look-tokens only.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
        - package: core-xsd
          match: ^
          version: 1.0.0
          alias: xsd
        - package: core-kanonak
          match: ^
          version: 2.0.0
          alias: ck
        - package: derivation
          match: ^
          version: 1.1.0
          alias: derivation
        - package: look
          match: ^
          version: 2.0.0
          alias: look
        - package: look-tokens
          match: ^
          version: 1.0.0
          alias: tok
        - package: link
          match: ^
          version: 1.0.0
          alias: link
        - package: transformations
          match: ^
          version: 3.17.0
          alias: tx
    - publisher: worldview.genval.ai
      packages:
        - package: core
          match: ^
          version: 2.0.0
          alias: wv
        - package: snapshots
          match: ^
          version: 2.1.13
          alias: snap
        - package: sources
          match: ^
          version: 1.0.0
          alias: src
        - package: estimates
          match: ^
          version: 1.0.0
          alias: est
        - package: finance
          match: ^
          version: 3.0.0
          alias: fin
        - package: securities
          match: ^
          version: 2.1.0
          alias: sec
        - package: regimes
          match: ^
          version: 1.0.0
          alias: reg
        - package: visual
          match: ^
          version: 2.0.0
          alias: vis
        - package: factors
          match: ^
          version: 1.0.0
          alias: fac
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: funds
          match: ^
          version: 1.1.4
          alias: wfund

index:
  type: ck.Publisher
  rdfs.label: worldview.genval.ai
  rdfs.comment: >-
    A continuously-updated probabilistic macro worldview — versioned
    snapshots of theses, confidence, evidence, and the conditions that
    would break them.
  derivation.look:
    type: look.PublisherView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
        look.subtitle: rdfs.comment
      - type: look.SectionNav
      - type: look.SectionHeading
        look.heading: "Latest worldview"
        look.note: "The current snapshot - every active thesis, its confidence, and what would break it."
      - type: look.FeaturedResource
        look.source: snap.view
      - type: look.SectionHeading
        look.heading: "The portfolio it implies"
        look.note: "The same theses carried through the alignment into signed target weights."
      - type: look.FeaturedResource
        look.source: wfund.genval-worldview-fund

rdfs.Resource:
  derivation.tokens:
    tok.bg: "#0a0e1a"
    tok.bg-card: "#0c1220"
    tok.bg-elev: "#162033"
    tok.text: "#e6eaf2"
    tok.text-dim: "#9aa5b8"
    tok.text-faint: "#6b7689"
    tok.border: "#1e293b"
    tok.border-soft: "#162033"
    tok.accent: "#38bdf8"
    tok.accent-hover: "#7dd3fc"
    tok.badge-bg: "rgba(56, 189, 248, 0.12)"
    tok.badge-fg: "#7dd3fc"
    tok.font-display: "'Iowan Old Style', 'Palatino Linotype', Palatino, 'URW Palladio L', serif"
    tok.font-body: "-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
  derivation.look:
    type: look.ResourceView
    look.bands:
      - type: look.Hero
        look.title: rdfs.label
        look.eyebrow: rdfs.type
        look.subtitle: rdfs.comment
      - type: look.Details

