            tx.readProp: wv.confidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.lowerPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateLower95
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: wv.confidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.upperPath:
          type: tx.PropertyRead
          tx.readProp: est.estimateUpper95
          tx.readSource:
            type: tx.PropertyRead
            tx.readProp: wv.confidence
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.hueBy:
          type: tx.Traverse
          tx.traverseSource: { type: tx.VarRef, tx.varName: input }
          tx.through: vis.thesisTheme
          tx.step:
            type: tx.PropertyRead
            tx.readProp: vis.themeHue
            tx.readSource: { type: tx.VarRef, tx.varName: input }
      - type: look.Markdown
        look.source: wv.thesisStatement
      - type: look.SectionHeading
        look.heading: "Drivers"
        look.note: "The underlying macro forces this thesis expresses - the loading mean is how much each force drives the thesis, the stddev our confidence in the mapping."
      - type: look.EmbeddedViews
        look.source: fac.hasDriverLoading
      - type: look.SectionHeading
        look.heading: "Supporting evidence"
        look.note: "Typed, citation-backed observations across time, grouped by strength. Hover a point for the claim."
      - type: look.TimePlot
        look.source: wv.supportingEvidence
        look.orderBy: wv.evidenceObservedAt
        look.laneBy:
          type: tx.Traverse
          tx.traverseSource: { type: tx.VarRef, tx.varName: input }
          tx.through: wv.evidenceStrength
          tx.step:
            type: tx.PropertyRead
            tx.readProp: rdfs.label
            tx.readSource: { type: tx.VarRef, tx.varName: input }
        look.labelPath:
          type: tx.PropertyRead
          tx.readProp: wv.evidenceStatement
          tx.readSource: { type: tx.VarRef, tx.varName: input }
      - type: look.SectionHeading
        look.heading: "What would invalidate this"
        look.note: "The machine-evaluable conditions that would falsify the thesis."
      - type: look.Horizon
        look.source: wv.invalidationCondition

