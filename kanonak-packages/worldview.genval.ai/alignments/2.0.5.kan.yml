  alignmentConfidence:
    estimateMean: 0.88
    estimateStdDev: 0.05
    betaAlpha: 36.3
    betaBeta: 4.9
  alignmentRationale: |
    Membership unchanged; `alignmentConfidence` firms 0.87 to 0.88. The vehicles separated for the first time in three windows: [[ws.ev-energy-equities-oct14|the producers rose 8-9% to window highs while USO rose 0.3%]]. [[ws.persistent-energy-shock]] is now a premium persisting through rerouted supply - [[ws.ev-east-west-pipeline-58mbd-oct6|the pipeline at 5.8 mb/d]], [[ws.ev-gulf-flows-81pct-prewar-sep|Gulf flows above 81% of pre-war]] - with [[ws.ev-brent-10606-oct14|Brent flat near $106]]. That is better expressed through producer cash flows at a high and stable price than through a front-month futures roll, so the producers firm and USO eases. XOM moves up to third on the strongest window move.
  hasAlignedSecurity:
    - alignedSecurity: sec.xle
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.90
        estimateStdDev: 0.05
        betaAlpha: 31.5
        betaBeta: 3.5
      securityRationale: |
        Firmed 0.89 to 0.90. [[ws.ev-energy-equities-oct14|XLE rose 8.0% to 67.63, a window high]], the liquid sector expression of a premium that is now holding through rerouted supply. **Primary-vehicle**.
    - alignedSecurity: sec.uso
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.86
        estimateStdDev: 0.07
        betaAlpha: 20.3
        betaBeta: 3.3
      securityRationale: |
        Eased 0.88 to 0.86 with the band widened. [[ws.ev-energy-equities-oct14|USO rose only 0.3%]] while the producers re-rated - a stable spot price earns the commodity vehicle nothing, and its roll drag counts against it over the thesis horizon.
    - alignedSecurity: sec.xom
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.85
        estimateStdDev: 0.06
        betaAlpha: 29.3
        betaBeta: 5.2
      securityRationale: |
        Firmed 0.84 to 0.85. [[ws.ev-energy-equities-oct14|XOM rose 9.2% to 177.01]], the strongest move in the basket - the largest integrated producer is the most direct beneficiary of a premium that persists at a stable price.
    - alignedSecurity: sec.cvx
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.83
        estimateStdDev: 0.06
        betaAlpha: 31.7
        betaBeta: 6.5
      securityRationale: |
        Firmed 0.81 to 0.83 with the band tightened. [[ws.ev-energy-equities-oct14|CVX rose 8.0% to 222.04]], ending the decoupling from crude that marked it down in the last two windows.

