ai-capex-cycle-with-china-tail-alignment:
  type: align.ThesisAlignment
  label: AI capex cycle alignment
  forThesis: ws.ai-capex-cycle-with-china-tail
  alignmentConfidence:
    estimateMean: 0.87
    estimateStdDev: 0.05
    betaAlpha: 38.5
    betaBeta: 5.8
  alignmentRationale: |
    One membership change. [[sec.mu]] replaces [[sec.intc]] as the high-beta proxy: MU sits in the same semiconductors sector as the Tier-1 names, and [[ws.ev-ai-complex-closes-sep24|rose 16.5% through $1,000 on the window]] on sold-out high-bandwidth memory. INTC has carried no evidence in two windows, and 2.0.3 already ranked it last for that reason. [[sec.amd]] rises level with [[sec.nvda]] on [[ws.ev-amd-1t-meta-muse-sep21|the agentic-CPU repricing that took it past $1 trillion]]. [[sec.orcl]] eases on financing: the most debt-funded name fell while the complex rallied, and hyperscaler issuance is now named as a driver of the long end. `alignmentConfidence` firms 0.86 to 0.87 because the basket's rank now matches its evidence.
  hasAlignedSecurity:
    - alignedSecurity: sec.nvda
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.90
        estimateStdDev: 0.04
        betaAlpha: 49.7
        betaBeta: 5.5
      securityRationale: |
        Held at 0.90. The canonical accelerator exposure with the densest evidence history; [[ws.ev-ai-complex-closes-sep24|NVDA rose 5.8% to 224.58]] through a 23-basis-point yield rise. **Primary-vehicle** on liquidity and franchise breadth, tied with AMD on strength and ranked first on evidence count.
    - alignedSecurity: sec.amd
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.90
        estimateStdDev: 0.03
        betaAlpha: 89.1
        betaBeta: 9.9
      securityRationale: |
        Firmed 0.89 to 0.90 with the band tightened. [[ws.ev-amd-1t-meta-muse-sep21|AMD rose about 10% on September 21 to a $1 trillion valuation]] as agentic AI pulled CPU demand into the cycle, and [[ws.ev-ai-complex-closes-sep24|finished the window +24.8% at a new closing high]]. It now expresses both the accelerator and the CPU legs of the capex cycle.
    - alignedSecurity: sec.avgo
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.86
        estimateStdDev: 0.05
        betaAlpha: 40.6
        betaBeta: 6.6
      securityRationale: |
        Eased 0.87 to 0.86. [[ws.ev-ai-complex-closes-sep24|AVGO rose 3.3%]], lagging the complex, and gave back 3.9% from its September 22 peak as yields spiked. Custom-silicon exposure keeps it a clean alternate.
    - alignedSecurity: sec.orcl
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.78
        estimateStdDev: 0.09
        betaAlpha: 15.7
        betaBeta: 4.4
      securityRationale: |
        Eased 0.82 to 0.78 with the band widened. [[ws.ev-ai-complex-closes-sep24|ORCL fell 0.6% while the complex rallied]] - the only AI name to fall - and [[ws.ev-10y-5223-sep24|hyperscaler debt issuance is now cited as a driver of the long end]], the financing channel on which ORCL is the most exposed name in the basket.
    - alignedSecurity: sec.mu
      securityRole: align.role-high-beta-proxy
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.74
        estimateStdDev: 0.08
        betaAlpha: 21.5
        betaBeta: 7.6
      securityRationale: |
        New to the basket, replacing INTC. Tier 2 via the semiconductors sector with direct window evidence: [[ws.ev-ai-complex-closes-sep24|MU rose 16.5% to 1,080.53, through 1,000 on September 18]]. **High-beta-proxy**: memory is where the cycle's operating leverage currently concentrates. The band is 0.08 because the September 30 report falls after this alignment.

