      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.74
        estimateStdDev: 0.08
        betaAlpha: 21.5
        betaBeta: 7.6
      securityRationale: |
        New to the basket, as Tier 1 via [[ws.ev-ndx-record-30732-sep22|the Nasdaq-100 record of September 22]]. [[ws.ev-spy-qqq-iwm-sep24|QQQ rose 5.2% against SPY's 1.3%]] - the mega-cap AI leadership is how the melt-up leg is being expressed. **High-beta-proxy**, with a band that reflects its overlap with the AI basket.
