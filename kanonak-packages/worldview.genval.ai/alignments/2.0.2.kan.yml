equity-melt-up-vs-recession-risk-alignment:
  type: align.ThesisAlignment
  label: Equity melt-up versus recession risk alignment
  forThesis: ws.equity-melt-up-vs-recession-risk
  alignmentConfidence:
    estimateMean: 0.74
    estimateStdDev: 0.08
    betaAlpha: 21.5
    betaBeta: 7.5
  alignmentRationale: |
    `alignmentConfidence` firms 0.72 to 0.74 and the basket gains a fourth leg. This is a tension thesis - melt-up versus building recession risk - and until now the basket expressed only the melt-up half long plus a vol hedge. This window produced a clean, typed expression of the other half: [[ws.ev-iwm-breadth-sep9|the Russell 2000 fell 1.9% across the window and another 0.8% on September 10, while SPY fell 0.4% and QQQ rose 1.0%]]. Short [[sec.iwm]] enters as **inverse-expression** - not a hedge against the thesis being wrong, but a direct expression of its narrow-melt-up character, which is what the thesis actually claims. [[sec.spy]] holds at 0.85 on twenty-two mentions and genuinely impressive resilience: [[ws.ev-spy-qqq-sep9|it gave up only 0.4% against Brent above $100 and a 4.85% ten-year]]. [[sec.uvix]] holds at 0.74 - [[ws.ev-vix-1644-sep9|the VIX at 16.44 and 16.08]] barely moved, and both invalidation legs remain unfired.
  hasAlignedSecurity:
    - alignedSecurity: sec.spy
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.85
        estimateStdDev: 0.05
        betaAlpha: 42.5
        betaBeta: 7.5
      securityRationale: |
        Twenty-two evidence mentions, nineteen strong, and named throughout [[ws.equity-melt-up-vs-recession-risk]]. Held at 0.85 on evidence that cuts both ways: [[ws.ev-spy-qqq-sep9|SPY absorbed a hostile macro tape with a 0.4% loss]], which is the melt-up behaviour the thesis describes, while the breadth underneath deteriorated. **Primary-vehicle** - the deepest, most liquid expression of the large-cap index the thesis is written about.
    - alignedSecurity: sec.vti
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.76
        estimateStdDev: 0.07
        betaAlpha: 27.1
        betaBeta: 8.6
      securityRationale: |
        Eased 0.78 to 0.76. Total-market exposure is structurally equivalent to [[sec.spy|SPY]] at the top but carries the small- and mid-cap tail that [[ws.ev-iwm-breadth-sep9|underperformed by more than two percentage points this window]]. In a melt-up that is narrowing rather than broadening, whole-market breadth is a drag on the expression rather than a diversifier. **Alternate-vehicle** on that basis.
    - alignedSecurity: sec.uvix
      securityRole: align.role-hedge
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.74
        estimateStdDev: 0.09
        betaAlpha: 16.8
        betaBeta: 5.9
      securityRationale: |
        Held at 0.74. **Hedge** in the strict sense - insurance against [[ws.equity-melt-up-vs-recession-risk]] resolving to its downside rather than an expression of it, sized as protection rather than as a directional bet. [[ws.ev-vix-1644-sep9|The VIX at 16.44 and 16.08]] sits above the 15 that the melt-up-completion invalidation leg requires and far below the 25 of the vol-expansion leg, so the hedge is neither cheap nor urgent. Decay cost keeps the band wide.
    - alignedSecurity: sec.iwm
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.66
        estimateStdDev: 0.10
        betaAlpha: 14.1
        betaBeta: 7.3
      securityRationale: |
        **New entry.** Short [[sec.iwm]] expresses the narrowing that is the actual content of this thesis's tension. [[ws.ev-iwm-breadth-sep9|The Russell 2000 fell 1.9% across the window and 0.8% more on September 10, against SPY at -0.4% and QQQ at +1.0%]] - a divergence that has now widened in two consecutive refreshes. **Inverse-expression** rather than hedge: this is the recession-risk half of the thesis taken directionally, not protection against the thesis being wrong. Entered at 0.66 with a wide band because small caps are the most rate-sensitive segment of the index and would rally hardest on [[ws.ev-aug-ppi-core-02-sep10|the soft-core-PPI path toward a dovish hold]], which is a live risk to this leg specifically.

hawkish-warsh-regime-alignment:
  type: align.ThesisAlignment
  label: Hawkish Warsh regime alignment
  forThesis: ws.hawkish-warsh-regime
  alignmentConfidence:
    estimateMean: 0.69
    estimateStdDev: 0.08
    betaAlpha: 22.4
    betaBeta: 10.1
  alignmentRationale: |
    `alignmentConfidence` rises 0.66 to 0.69 on the cleanest structural evidence this basket has received. The duration shorts are no longer expressing a policy signal, they are expressing an observed market failure: [[ws.ev-treasury-buyback-tripled-6b-sep9|Treasury tripled its long-dated buyback to $6B explicitly to cap borrowing costs]] and [[ws.ev-10y-485-30y-5307-sep9|the 30-year rose through 5.3% to 5.307% in the same session]], with [[ws.ev-tlt-8100-sep10|TLT making fresh lows the following morning]]. Short [[sec.tlt]] firms 0.78 to 0.81 and short [[sec.ief]] 0.70 to 0.72. A newly-visible supply mechanism reinforces both: [[ws.ev-ai-debt-68pct-treasury-borrowing-sep10|AI-related issuance now equals roughly 68% of new long-duration Treasury borrowing]], meaning the long end faces private competition for duration that no policy path resolves. The trend-carry legs hold - they harvest the regime with a lag rather than expressing it. Bands do not tighten because [[ws.ev-aug-ppi-core-02-sep10|core PPI at +0.2% against +0.3% expected]] keeps a dovish hold live six days out.
  hasAlignedSecurity:
    - alignedSecurity: sec.tlt
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.81
        estimateStdDev: 0.07
        betaAlpha: 24.9
        betaBeta: 5.8
      securityRationale: |
        Short [[sec.tlt]] is the purest expression of [[ws.hawkish-warsh-regime]] - long-duration Treasuries fall most under a higher-for-longer path with a live hike bias, and TLT is named in the thesisStatement. Raised 0.78 to 0.81 on the failed-intervention evidence: [[ws.ev-treasury-buyback-tripled-6b-sep9|a tripled buyback aimed at capping yields]] met [[ws.ev-10y-485-30y-5307-sep9|a 30-year that broke 5.3% anyway]]. When the largest buyer in the market cannot arrest the move, the structural case for the short is stronger than any statement from the chair. **Inverse-expression** - the mechanism IS the thesis, taken short.
    - alignedSecurity: sec.ief
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.72
        estimateStdDev: 0.09
        betaAlpha: 17.2
        betaBeta: 6.7
      securityRationale: |
        Short [[sec.ief]] captures the intermediate sector, driven more by the policy rate itself than by term premium. Raised 0.70 to 0.72 alongside the [[sec.tlt|TLT]] leg but kept below it: [[ws.ev-sept-hike-odds-606pct-sep8|September hike odds at 60.6%]] mean the belly has already absorbed much of the expected move, whereas the long end is repricing on supply and term premium, which has further to run.
    - alignedSecurity: sec.dbmf
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.56
        estimateStdDev: 0.10
        betaAlpha: 13.3
        betaBeta: 10.5
      securityRationale: |
        Long [[sec.dbmf]] harvests the regime through managed-futures short-rates and commodity sleeves rather than expressing it directly. Held at 0.56 - trend-following is structurally positioned for a persistent higher-for-longer path but enters positions with a lag, so it captures the continuation of this regime rather than its confirmation. **Alternate-vehicle** with a wide, manager-dependent band.
    - alignedSecurity: sec.kmlm
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.50
        estimateStdDev: 0.11
        betaAlpha: 9.8
        betaBeta: 9.8
      securityRationale: |
        Long [[sec.kmlm]] is the second managed-futures sleeve, held at 0.50 and ranked last. Near-substitute for [[sec.dbmf|DBMF]] with a different manager and weighting scheme; retained for manager diversification within the trend-carry leg rather than for any distinct thesis exposure. Widest band in the basket.
