        estimateStdDev: 0.07
        betaAlpha: 25.7
        betaBeta: 6.4
      securityRationale: |
        Held at 0.80. Carries the capex-consumer end of the cycle - the hyperscaler committing the spend rather than the supplier booking it - which is the leg that most directly bears [[ws.ev-ai-debt-68pct-treasury-borrowing-sep10|the debt-financing cost now visible in the long end]]. Retained for basket breadth across the value chain; band held wide to reflect that financing exposure.
