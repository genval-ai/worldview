        Raised 0.88 to 0.90 - the largest single move in this basket. [[ws.ev-amd-citi-tmt-70b-2027-sep8|The Citi TMT guide of roughly $70B of 2027 data-center revenue, with MI450 and Helios already shipping and gigawatt anchor commitments from OpenAI, Meta and Anthropic]] converts AMD from a second source into an independently-visible franchise, and [[ws.ev-amd-clsa-pt-710-sep8|CLSA lifted its target to $710]]. Twenty-one evidence mentions. This is now the closest read on whether AI compute spend broadens beyond one winner, and it answered affirmatively this window.
