equity-melt-up-vs-recession-risk-alignment:
  type: align.ThesisAlignment
  label: Equity melt-up versus recession risk alignment
  forThesis: ws.equity-melt-up-vs-recession-risk
  alignmentConfidence:
    estimateMean: 0.75
    estimateStdDev: 0.08
    betaAlpha: 21.2
    betaBeta: 7.1
  alignmentRationale: |
    `alignmentConfidence` firms 0.74 to 0.75 because both halves of this tension thesis now have a leg that is behaving as the thesis says it should. The recession-risk half: [[ws.ev-spy-qqq-iwm-sep15|IWM fell 1.9% across the window against SPY at 0.7% and QQQ at 1.6%]], a fourth consecutive window of small-cap underperformance, and the specific risk 2.0.2 named for the short - a dovish path lifting the most rate-sensitive segment - receded when [[ws.ev-fomc-sep16-hike-375-400|the Fed hiked]]. Short [[sec.iwm]] firms 0.66 to 0.70. [[sec.uvix]] firms 0.74 to 0.76 because [[ws.ev-vix-1720-sep15|the VIX closed 17.20 and traded near 18 on Fed day]] and [[ws.ev-fed-day-equities-sep16|the index reversed from +0.3% to -0.8% during the press conference]] - a Fed hiking into a 5% long end makes the vol-expansion leg more live. The melt-up half: [[sec.spy]] holds at 0.85 on [[ws.ev-spx-758573-sep15|an index at 7,585.73, within 1.5% of its high]] and twenty-three mentions; [[sec.vti]] eases to 0.75 as the small-cap tail it carries kept dragging. QQQ was considered for the open fifth slot and excluded because it duplicates the AI basket and would double-count that driver in the fund stage; the exclusion is recorded here so a future refresh can revisit it if the melt-up re-narrows to mega-cap.
  hasAlignedSecurity:
    - alignedSecurity: sec.spy
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.85
        estimateStdDev: 0.05
        betaAlpha: 42.5
        betaBeta: 7.5
      securityRationale: |
        Twenty-three evidence mentions and named throughout [[ws.equity-melt-up-vs-recession-risk]]. Held at 0.85: [[ws.ev-spy-qqq-iwm-sep15|SPY closed 757.39, down 0.7% across a window with a 5% ten-year and a rate hike]] - the tape bent rather than broke, which is still the behaviour the thesis describes, and [[ws.ev-spx-758573-sep15|the index sits within 1.5% of its high]]. **Primary-vehicle** for the large-cap index the thesis is written about.
    - alignedSecurity: sec.vti
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.75
        estimateStdDev: 0.07
        betaAlpha: 28.0
        betaBeta: 9.3
      securityRationale: |
        Eased 0.76 to 0.75. Total-market exposure carries the small- and mid-cap tail that [[ws.ev-spy-qqq-iwm-sep15|underperformed large caps by more than a point for a fourth consecutive window]]. In a narrowing melt-up, whole-market breadth is a drag on the expression, and this basket now shorts that tail explicitly, making an unqualified VTI leg partially self-cancelling. **Alternate-vehicle** on that basis.
    - alignedSecurity: sec.uvix
      securityRole: align.role-hedge
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.76
        estimateStdDev: 0.09
        betaAlpha: 16.3
        betaBeta: 5.2
      securityRationale: |
        Raised 0.74 to 0.76. **Hedge** in the strict sense - insurance against [[ws.equity-melt-up-vs-recession-risk]] resolving to its downside. [[ws.ev-vix-1720-sep15|The VIX rose from 16.44 to 17.20 and traded near 18 on Fed day]], still between both invalidation thresholds, but [[ws.ev-fed-day-equities-sep16|an index that sold the press conference with the Dow down more than 700]] and [[ws.ev-umich-478-sep11|sentiment at its second-lowest reading ever]] make the vol-expansion leg more live than a fortnight ago. Decay cost keeps the band wide.
    - alignedSecurity: sec.iwm
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.70
        estimateStdDev: 0.09
        betaAlpha: 17.4
        betaBeta: 7.5
      securityRationale: |
        Raised 0.66 to 0.70 and the band narrowed 0.10 to 0.09. Short [[sec.iwm]] expresses the narrowing that is the content of this thesis's tension, and [[ws.ev-spy-qqq-iwm-sep15|IWM closed 285.14, down 1.9% across the window against SPY's 0.7%]] - a fourth consecutive window of underperformance. The specific risk named at entry, a dovish hold lifting the most rate-sensitive segment, receded when [[ws.ev-fomc-sep16-hike-375-400|the Fed hiked]] with [[ws.ev-fomc-sep16-sep-one-more-hike|one more projected]]. **Inverse-expression**: the recession-risk half taken directionally, not protection against the thesis being wrong.

hawkish-warsh-regime-alignment:
  type: align.ThesisAlignment
  label: Hawkish Warsh regime alignment
  forThesis: ws.hawkish-warsh-regime
  alignmentConfidence:
    estimateMean: 0.73
    estimateStdDev: 0.08
    betaAlpha: 21.8
    betaBeta: 8.0
  alignmentRationale: |
    `alignmentConfidence` rises 0.69 to 0.73 because the event the duration shorts were built to express was delivered: [[ws.ev-fomc-sep16-hike-375-400|a 25bp hike to 3.75-4.00% on a 12-0 vote]], [[ws.ev-fomc-sep16-sep-one-more-hike|a median dot of 4.1% for both 2026 and 2027 with no cut before 2028]], and [[ws.ev-warsh-too-high-too-long-sep16|a chair who says inflation has been too high for too long and that conditions are not restrictive]]. The curve had already moved - [[ws.ev-10y-500-sep15|the ten-year closed at 5.00%]], [[ws.ev-30y-5367-sep15|the thirty-year at 5.367%]], [[ws.ev-tlt-8071-ief-9082-sep15|TLT at a new cycle low]] - so short [[sec.tlt]] firms 0.81 to 0.84 and short [[sec.ief]] 0.72 to 0.74. The trend-carry legs firm a notch each: a hiking regime is what managed futures harvest, and they now have a confirmed trend to follow. The bands do not tighten as far as the thesis's own did, for a reason the fund stage should carry: [[ws.ev-fed-day-yields-gold-oil-sep16|the long end rallied four basis points on the decision]]. The thesis is about the regime; the shorts are about the path, and a market that buys duration on a delivered hike is beginning to price the path's end.
  hasAlignedSecurity:
    - alignedSecurity: sec.tlt
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.84
        estimateStdDev: 0.06
        betaAlpha: 30.5
        betaBeta: 5.8
      securityRationale: |
        Short [[sec.tlt]] is the purest expression of [[ws.hawkish-warsh-regime]] and is named in its thesisStatement. Raised 0.81 to 0.84 with the band narrowed 0.07 to 0.06: [[ws.ev-fomc-sep16-hike-375-400|the hike was delivered]], [[ws.ev-fomc-sep16-sep-one-more-hike|another is projected]], and [[ws.ev-tlt-8071-ief-9082-sep15|TLT closed 80.71, a new cycle low]] after [[ws.ev-10y-500-sep15|the ten-year's first 5% close since 2007]]. Not raised further because [[ws.ev-fed-day-yields-gold-oil-sep16|the long end rallied on the decision]] - the event risk that pushed yields into the meeting is now behind the market. **Inverse-expression** - the mechanism IS the thesis, taken short.
    - alignedSecurity: sec.ief
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.74
        estimateStdDev: 0.08
        betaAlpha: 21.5
        betaBeta: 7.6
      securityRationale: |
        Short [[sec.ief]] captures the intermediate sector, driven by the policy rate rather than term premium. Raised 0.72 to 0.74 alongside the [[sec.tlt|TLT]] leg: the policy rate is now [[ws.ev-fomc-sep16-hike-375-400|3.75-4.00%]] with [[ws.ev-fomc-sep16-sep-one-more-hike|a 4.1% median for two years]]. Kept below TLT because a delivered hike plus one fully projected leaves the belly with less unpriced move than the long end, which is repricing on supply.
    - alignedSecurity: sec.dbmf
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.58
        estimateStdDev: 0.10
        betaAlpha: 13.6
        betaBeta: 9.8
      securityRationale: |
        Long [[sec.dbmf]] harvests the regime through managed-futures short-rates and commodity sleeves rather than expressing it directly. Raised 0.56 to 0.58: [[ws.ev-fomc-sep16-hike-375-400|a delivered hike]] and [[ws.ev-10y-500-sep15|a ten-year at 5%]] give trend-following a confirmed direction to follow, which is the condition under which it captures a regime rather than lagging it. **Alternate-vehicle** with a wide, manager-dependent band.
    - alignedSecurity: sec.kmlm
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.52
        estimateStdDev: 0.11
        betaAlpha: 10.2
        betaBeta: 9.4
      securityRationale: |
        Long [[sec.kmlm]] is the second managed-futures sleeve, raised 0.50 to 0.52 with [[sec.dbmf|DBMF]] and ranked last. Near-substitute with a different manager and weighting scheme; retained for manager diversification within the trend-carry leg rather than for distinct thesis exposure. Widest band in the basket.
