alignments:
  type: Package
  publisher: worldview.genval.ai
  version: 2.0.7
  label: Alignment data - patch refresh against snapshot 4.2.0
  comment: >-
    Patch refresh of the public alignment data, re-derived against worldview
    snapshot 4.2.0 (Tuesday November 24 - Democrats won both chambers and the
    defense names fell on budget fears; the October minutes, Waller and a
    certain December hike firmed the hawkish regime; Brent fell about 22% to a
    three-month low as the IEA forecast a surplus; Nvidia beat, lost and regained
    its CEO, and the S&P 500 corrected with the VIX above 30 before its best day
    since April 2025). Same seven wv.active theses as 2.0.6, so a patch, and no
    basket changes membership. The energy legs of the stagflation basket ease as
    the energy input to inflation turns and the rate legs firm; the defense basket
    eases on appropriations risk; the UVIX hedge firms; IEF firms in the hawkish
    basket; NVDA's band widens on governance and export-compliance risk. No
    securities bump. Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
        - package: core-kanonak
          match: ^
          version: 2.4.0
          alias: kanonak
    - publisher: worldview.genval.ai
      packages:
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: estimates
          match: ^
          version: 1.0.0
          alias: est
        - package: securities
          match: ^
          version: 2.4.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.2.0
          alias: ws

view:
  type: align.Alignment
  label: Thesis alignments (2.0.7 - patch refresh against snapshot 4.2.0, the Tuesday November 24 moment - a Democratic Congress and a defense selloff, a certain December hike with a half point discussed, Brent at a three-month low on a forecast surplus, Nvidia's beat and its CEO's exit and return, and an S&P 500 correction followed by its best day since April 2025; no membership changes, the stagflation energy legs and the defense basket ease, UVIX and IEF firm)
  alignmentObservedAt: 2026-11-24T05:10:52Z
  derivedFromSnapshot: ws.view
  alignmentNarrative: |
    Patch refresh against [[ws.view|worldview snapshot 4.2.0]] (observedAt 2026-11-24T04:31:02Z). Same seven `wv.active` theses as 2.0.6 - [[ws.powell-warsh-transition-risk|the Fed-transition thesis]] stays retired - so no `ThesisAlignment` is added or dropped, and no basket changes membership. Snapshot drift since 2.0.6, for downstream joint math: [[ws.hawkish-warsh-regime|hawkish-Warsh]] 0.92 to 0.94, [[ws.stagflation-risk|stagflation]] 0.86 to 0.83, [[ws.ai-capex-cycle-with-china-tail|ai-capex]] 0.87 to 0.82, [[ws.iran-war-rearmament|defense]] 0.92 to 0.86, [[ws.persistent-energy-shock|energy]] 0.91 to 0.83, [[ws.equity-melt-up-vs-recession-risk|equity]] 0.70 to 0.60, [[ws.gold-debasement-bid|gold]] 0.79 to 0.68.

    **The snapshot's evidence this window is mostly macro and policy, researched by web search without vehicle-level price data.** So the strengths below move where an item bears on a vehicle's structural fit, and hold where nothing new names or bears on it.

    **Energy no longer carries the inflation input.** [[ws.ev-iea-omr-q4-surplus-17mbd-nov13|The IEA forecasts a fourth-quarter surplus]] and [[ws.ev-brent-8937-three-month-low-nov23|Brent fell about 22%]], while [[ws.ev-oct-ppi-65-yoy-nov13|PPI rose to 6.5% with energy falling]]. In the stagflation basket [[sec.uso]] and [[sec.xle]] ease and the rate shorts firm; in the energy basket the producers hold, since the strait is still closed.

    **Appropriations risk reaches the defense basket.** [[ws.ev-defense-stocks-slide-democratic-sweep-nov4|The names fell more than 3% on the Democratic sweep]]; [[sec.lmt]] and [[sec.rtx]] ease two points on contracted munitions, and [[sec.noc]] three as the platform name.

    **The hiking path lands at the belly.** [[ws.ev-fomc-minutes-oct-further-hikes-nov18|The minutes]], [[ws.ev-waller-half-point-december-nov18|Waller's half point]] and [[ws.ev-nvda-31pct-day-dec-hike-certain-nov23|a certain December hike]] firm short [[sec.ief]] in both rate baskets, while short [[sec.tlt]] holds as the long end rose and retraced.

    **Volatility paid the hedge.** [[ws.ev-spx-correction-vix-above-30-nov20|The VIX rose above 30 in the correction]], so [[sec.uvix]] firms to second in the equity basket.

    **Basket-level changes at a glance.** No membership changes. Stagflation eases USO, XLE and GLD and firms IEF; energy eases USO; defense eases all three; gold eases GDX; AI eases AMD and widens NVDA's band; equity firms UVIX and eases the IWM short; hawkish-Warsh firms IEF.
  hasAlignment:
    - stagflation-risk-alignment
    - persistent-energy-shock-alignment
    - iran-war-rearmament-alignment
    - gold-debasement-bid-alignment
    - ai-capex-cycle-with-china-tail-alignment
    - equity-melt-up-vs-recession-risk-alignment
    - hawkish-warsh-regime-alignment

stagflation-risk-alignment:
  type: align.ThesisAlignment
  label: Stagflation risk alignment
  forThesis: ws.stagflation-risk
  alignmentConfidence:
    estimateMean: 0.58
    estimateStdDev: 0.10
    betaAlpha: 13.5
    betaBeta: 9.8
  alignmentRationale: |
    Membership unchanged; `alignmentConfidence` eases 0.60 to 0.58. [[ws.stagflation-risk]] eased 0.86 to 0.83 as [[ws.ev-oct-nfp-165k-nov6|payrolls rose 165,000 and unemployment fell to 4.1%]], so the stag half weakened again while the inflation half held: [[ws.ev-oct-cpi-04-core-03-nov10|October CPI ran 0.4% with core 0.3%]] and [[ws.ev-oct-ppi-65-yoy-nov13|PPI reached 6.5% on the year]]. What changed is where that inflation comes from. [[ws.ev-iea-omr-q4-surplus-17mbd-nov13|The IEA now forecasts a fourth-quarter surplus]] and [[ws.ev-brent-8937-three-month-low-nov23|Brent fell to a three-month low]], so the energy legs no longer carry the inflation input and both ease, while the rate legs firm on [[ws.ev-fomc-minutes-oct-further-hikes-nov18|minutes in which almost all participants expect further hikes]]. IEF moves above XLE. The basket still has no instrument for the stag half.
  hasAlignedSecurity:
    - alignedSecurity: sec.tlt
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.78
        estimateStdDev: 0.08
        betaAlpha: 20.1
        betaBeta: 5.7
      securityRationale: |
        Held at 0.78. [[ws.ev-10y-5125-trump-no-deal-nov12|The 10-year rose to 5.125% and the 30-year to 5.449%]] after hot inflation data, then gave it back to [[ws.ev-nvda-31pct-day-dec-hike-certain-nov23|4.92% by November 23]]. **Inverse-expression** of the rate consequence of persistent inflation, with support and retracement roughly offsetting.
    - alignedSecurity: sec.uso
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.68
        estimateStdDev: 0.10
        betaAlpha: 14.1
        betaBeta: 6.6
      securityRationale: |
        Eased 0.75 to 0.68 with the band widened. [[ws.ev-brent-8937-three-month-low-nov23|Brent fell about 22% to $89.37]] and [[ws.ev-iea-omr-q4-surplus-17mbd-nov13|the IEA forecasts a 1.7 million barrel a day fourth-quarter surplus]], while [[ws.ev-oct-ppi-65-yoy-nov13|PPI energy fell 0.1%]]: the energy input to inflation has turned, so the commodity expresses this thesis less directly.
    - alignedSecurity: sec.ief
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.63
        estimateStdDev: 0.09
        betaAlpha: 17.5
        betaBeta: 10.3
      securityRationale: |
        Firmed 0.58 to 0.63. [[ws.ev-fomc-minutes-oct-further-hikes-nov18|The October minutes]] and [[ws.ev-nvda-31pct-day-dec-hike-certain-nov23|a December hike priced as certain]] press the belly, where an inflation-driven hiking path lands first.
    - alignedSecurity: sec.xle
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.62
        estimateStdDev: 0.10
        betaAlpha: 14.0
        betaBeta: 8.6
      securityRationale: |
        Eased 0.66 to 0.62. The producers carry the same turn in the energy input as [[sec.uso|USO]] - [[ws.ev-iea-omr-q4-surplus-17mbd-nov13|a forecast surplus as Gulf exports recover]] - softened by their equity cushion.
    - alignedSecurity: sec.gld
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.40
        estimateStdDev: 0.11
        betaAlpha: 7.5
        betaBeta: 11.3
      securityRationale: |
        Eased 0.45 to 0.40. [[ws.ev-gold-14-month-low-3739-nov18|Gold fell to a 14-month low]] as hikes were priced - gold is behaving as a rate-sensitive asset, not an inflation hedge, inside this basket.

