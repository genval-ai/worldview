  hasAlignedSecurity:
    - alignedSecurity: sec.gld
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.92
        estimateStdDev: 0.03
        betaAlpha: 74.3
        betaBeta: 6.5
      securityRationale: |
        Long [[sec.gld]] is the canonical liquid vehicle - named in thesisStatement with multiple directly-tagged prints including [[ws.ev-gld-42260-aug27|422.60 on August 27]], against [[ws.ev-cb-45pct-increase-reserves-aug|a record 45% of central banks intending to add reserves]]. Deep volume and tight tracking. Held at 0.92 with the tightest band in the basket.
