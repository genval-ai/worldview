ai-capex-cycle-with-china-tail-alignment:
  type: align.ThesisAlignment
  label: AI capex cycle alignment
  forThesis: ws.ai-capex-cycle-with-china-tail
  alignmentConfidence:
    estimateMean: 0.86
    estimateStdDev: 0.05
    betaAlpha: 40.6
    betaBeta: 6.6
  alignmentRationale: |
    Five-name supplier stack, unchanged in composition and rank. The window delivered the strongest single confirmation the thesis has had - [[ws.ev-nvda-q2-fy27-dc-89b|a record $89.0B NVIDIA data-center quarter, up 117% year-over-year]] on top of [[ws.ev-amd-q2-2026-dc-107pct-aug4|AMD data-center growth of 107%]] - so bands tighten at the top of the stack even though means are already near ceiling. The China tail did not shrink but it did become legible: [[ws.ev-nvda-zero-china-dc-guidance|NVIDIA now guides assuming zero China data-center revenue]], which converts an open risk into a known exclusion. alignmentConfidence steps to 0.86.
  hasAlignedSecurity:
    - alignedSecurity: sec.nvda
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.92
        estimateStdDev: 0.02
        betaAlpha: 168.4
        betaBeta: 14.6
      securityRationale: |
        Long [[sec.nvda]] is the primary vehicle - named in thesisStatement and carrying four directly-tagged evidence instances this window alone, including [[ws.ev-nvda-q2-fy27-962b-aug26|$96.2B revenue up 106%]] and [[ws.ev-nvda-shares-plus87-aug27|an 8.7% move to 227.98 the following session]]. Band tightens to 0.02, the tightest in the alignment: no other name has this evidence density.
    - alignedSecurity: sec.amd
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.88
        estimateStdDev: 0.04
        betaAlpha: 57.2
        betaBeta: 7.8
      securityRationale: |
        Long [[sec.amd]] is the closest merchant-silicon alternate, with [[ws.ev-amd-q2-2026-dc-107pct-aug4|107% data-center growth]] confirming the demand read is not NVIDIA-specific. Held at 0.88; the post-print 6.86% share slip is a positioning event, not a structural one.
    - alignedSecurity: sec.avgo
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.86
        estimateStdDev: 0.05
        betaAlpha: 40.6
        betaBeta: 6.6
      securityRationale: |
        Long [[sec.avgo]] captures the custom-accelerator and networking side of the same capex, which is where hyperscaler spend flows when it is not buying merchant GPUs. Held at 0.86 - a genuine diversifier within the thesis rather than a duplicate of the [[sec.nvda|NVDA]] exposure.
    - alignedSecurity: sec.orcl
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.80
        estimateStdDev: 0.07
        betaAlpha: 25.3
        betaBeta: 6.3
      securityRationale: |
        Long [[sec.orcl]] expresses the capex cycle one layer up, at the contracted-backlog level rather than the silicon level. Held at 0.80 with a wider band: the exposure is real but mediated by execution and financing risk that the chip names do not carry.
    - alignedSecurity: sec.intc
      securityRole: align.role-high-beta-proxy
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.68
        estimateStdDev: 0.08
        betaAlpha: 22.4
        betaBeta: 10.6
      securityRationale: |
        Long [[sec.intc]] is the turnaround-leveraged proxy - the largest payoff if AI capex broadens to a second domestic foundry source, and the largest downside if it does not. Held at 0.68 with the widest band in the stack: the thesis fit depends on a company-specific execution path, not on the capex cycle alone.

equity-melt-up-vs-recession-risk-alignment:
  type: align.ThesisAlignment
