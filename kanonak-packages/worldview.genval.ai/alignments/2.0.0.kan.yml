alignments:
  type: Package
  publisher: worldview.genval.ai
  version: 2.0.0
  label: Alignment data - major re-derivation against snapshot 4.0.0
  comment: >-
    Major re-derivation of the public alignment data against worldview snapshot
    4.0.0 (Friday August 28 - the 60-day US-Iran ceasefire lapsed on August 17 with
    no deal and the naval blockade was reimposed, taking WTI back to ~$82.55 and
    energy to sector leadership; the July 29 FOMC held 9-3 over three hawkish
    dissents and the 30Y reached 5.33%, its highest since 2007, in a global bond
    rout; gold recovered ~15% on record 289t Q2 central-bank buying; NVIDIA printed
    a record $89.0B data-center quarter). MAJOR because the source snapshot is - the
    same seven wv.active theses carry over with no ThesisAlignment added or dropped,
    but the regime reframe means every basket is re-derived rather than refreshed.
    Strength moves are confined to fit that changed on new security-tagged evidence:
    LMT 0.89 to 0.91, GDX 0.76 to 0.79, short TLT 0.70 to 0.74, short IEF 0.64 to
    0.66, NVDA band to 0.02, UVIX 0.70 to 0.68. No securities bump, no Tier-3
    additions. Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
    - publisher: worldview.genval.ai
      packages:
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: estimates
          match: ^
          version: 1.0.0
          alias: est
        - package: securities
          match: ^
          version: 2.3.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.0.0
          alias: ws

view:
  type: align.Alignment
  label: Thesis alignments (2.0.0 - major re-derivation against snapshot 4.0.0, the Friday August 28 moment - the Iran ceasefire lapsed and the blockade returned with WTI back to ~$82.55, the July 29 FOMC held 9-3 over three hawkish dissents with the 30Y at 2007 highs, gold recovered on record Q2 central-bank buying, and NVIDIA printed a record data-center quarter; same seven baskets, every rationale re-derived, six strength parameters move)
  alignmentObservedAt: 2026-08-28T13:32:00Z
  alignmentNarrative: |
    Major re-derivation against [[ws.view|worldview snapshot 4.0.0]] (observedAt 2026-08-28T13:20:00Z). The bump is MAJOR because the source snapshot is: the de-escalation framing that 3.0.x was built on reversed, and [[ws.persistent-energy-shock]] re-rated +0.30. The same seven `wv.active` theses carry over, so no `ThesisAlignment` is added or dropped and there is no securities bump - but the regime the baskets sit in is materially different, so every rationale is re-derived rather than refreshed.

    **What moved at the alignment level, and what did not.** `alignmentStrength` measures structural fit, independent of thesis confidence, so the +0.30 energy re-rate does NOT move the energy basket - [[sec.xle]] / [[sec.xom]] / [[sec.cvx]] express the thesis exactly as strongly whether conviction is 0.45 or 0.75, and that discount is applied downstream from the snapshot band. What DID move is fit that changed on new security-tagged evidence: [[sec.lmt]] 0.89 to 0.91 on [[ws.ev-lmt-q2-2026-backlog-230b|a record $230.4B backlog]] and [[ws.ev-lmt-thaad-35b-multiyear|a $35B THAAD award]]; [[sec.gdx]] 0.76 to 0.79 on [[ws.ev-gdx-10369-aug27|its strongest single-day rally since 2022]]; [[sec.tlt]] short 0.70 to 0.74 and [[sec.ief]] short 0.64 to 0.66 as [[ws.ev-30y-yield-2007-high-jul29|the long end repriced to 2007 highs]]; [[sec.nvda]]'s band tightening to 0.02 on four directly-tagged evidence instances; and [[sec.uvix]] 0.70 to 0.68 as [[ws.ev-vix-1447-aug28|vol compressed to 14.47]].

    **The rate-path overlap is now the largest cross-thesis duplication.** [[hawkish-warsh-regime-alignment|The hawkish-Warsh basket]] and [[stagflation-risk-alignment|the stagflation basket]] both carry short [[sec.tlt]] and short [[sec.ief]], and both stepped those legs UP this refresh on the same August bond rout. That is one force expressed twice, not two independent bets - it must dedupe downstream on the `rate-path` driver rather than summing, or the book will carry roughly double the intended short-duration exposure.

    **The energy and defense baskets now share a driver too.** [[persistent-energy-shock-alignment|Energy]] and [[iran-war-rearmament-alignment|rearmament]] both strengthened on the same event - [[ws.ev-iran-ceasefire-expired-aug17|the ceasefire lapsing]] - through the `geopolitical-conflict` driver. The expressions are genuinely different (crude beta versus contracted procurement backlog), so both belong, but the shared driver is real and should be counted once at its strongest channel.

    **Gold's strength is flow-based, not price-based.** [[gold-debasement-bid-alignment|The gold basket]] rests on [[ws.ev-cb-q2-2026-289t-record|record Q2 central-bank buying accumulated through a quarter in which price fell]] rather than on the August rally. At [[ws.ev-gold-4650-aug28|~$4,650]] gold remains roughly 17% below its January record, so a downstream consumer should read this basket as structural accumulation, not momentum.

    **No Tier-3 additions.** Every candidate resolved against published securities 2.3.0; no new tickers were required, so no securities bump accompanies this alignment.
  derivedFromSnapshot: ws.view
  hasAlignment:
    - stagflation-risk-alignment
    - persistent-energy-shock-alignment
    - iran-war-rearmament-alignment
    - gold-debasement-bid-alignment
    - ai-capex-cycle-with-china-tail-alignment
    - equity-melt-up-vs-recession-risk-alignment
    - hawkish-warsh-regime-alignment

stagflation-risk-alignment:
  type: align.ThesisAlignment
  label: Stagflation risk alignment
  forThesis: ws.stagflation-risk
  alignmentConfidence:
    estimateMean: 0.58
    estimateStdDev: 0.10
    betaAlpha: 13.5
    betaBeta: 9.8
  alignmentRationale: |
    Mixed-expression basket - no single clean vehicle, which is why alignmentConfidence stays modest at 0.58. The August window sharpened two legs. Short [[sec.tlt]] steps to 0.68 because the long-end repricing became the thesis's most visible channel - [[ws.ev-30y-yield-2007-high-jul29|the 30Y reached its highest since 2007]] and [[ws.ev-global-bond-rout-aug|the rout went global]]. Long [[sec.xle]] steps to 0.64 because [[ws.ev-wti-8255-aug28|the energy accelerant that 3.0.1 wrote off has returned]], restoring the passthrough leg. [[sec.gld]] holds as the debasement expression, and short [[sec.ief]] eases up on the belly repricing. Note [[hawkish-warsh-regime-alignment|the hawkish-Warsh basket]] shares the short-rate legs; that overlap dedupes downstream on the rate-path driver rather than being counted twice here.
  hasAlignedSecurity:
    - alignedSecurity: sec.tlt
      securityRole: align.role-inverse-expression
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.68
        estimateStdDev: 0.09
        betaAlpha: 17.6
        betaBeta: 8.3
      securityRationale: |
        Short [[sec.tlt]] is the purest stagflation expression available - long-duration Treasuries lose on both the inflation and the term-premium channel. Steps up from 0.65 because [[ws.ev-yields-aug28|the 30Y at 5.20% off a 5.33% peak]] makes the channel observable rather than forecast. Band tightens on the corroboration.
    - alignedSecurity: sec.gld
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.62
        estimateStdDev: 0.10
        betaAlpha: 14.0
        betaBeta: 8.6
      securityRationale: |
        Long [[sec.gld]] expresses the inflation leg without taking equity-cycle risk. Held at 0.62 - the gold case is genuinely stronger this window, but it is carried at full strength in [[gold-debasement-bid-alignment|the dedicated gold basket]], and inflating it here would double-count the same [[ws.ev-cb-q2-2026-289t-record|official-sector flow]] evidence across two theses.
    - alignedSecurity: sec.xle
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.64
        estimateStdDev: 0.09
        betaAlpha: 17.6
        betaBeta: 9.9
      securityRationale: |
        Long [[sec.xle]] is the energy-passthrough leg of stagflation. Steps up from 0.60: 3.0.1 judged the accelerant reversed, but [[ws.ev-iran-ceasefire-expired-aug17|the ceasefire lapse]] and [[ws.ev-xle-6229-aug27|energy retaking sector leadership]] restore it. Alternate rather than primary because energy inflation is one input to stagflation, not the whole thesis.
    - alignedSecurity: sec.dbmf
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.55
        estimateStdDev: 0.12
        betaAlpha: 8.9
        betaBeta: 7.3
      securityRationale: |
        Long [[sec.dbmf]] is managed-futures trend carry - structurally long the persistence of whatever macro trend is running, which in a stagflation regime is rates-up and commodities-up. Held at 0.55 with a wide band: the vehicle is a bet on trend persistence rather than on the thesis mechanism itself.
    - alignedSecurity: sec.ief
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-short
      alignmentStrength:
        estimateMean: 0.55
        estimateStdDev: 0.10
        betaAlpha: 13.1
        betaBeta: 10.7
      securityRationale: |
        Short [[sec.ief]] takes the same rate-path leg as [[sec.tlt|TLT]] at the belly rather than the long end. Steps up marginally from 0.53 as [[ws.ev-yields-aug28|the 10Y at 4.68%]] repriced alongside the long end. Lower strength than the TLT leg because the belly carries less term-premium sensitivity, which is where the stagflation signal is clearest.

persistent-energy-shock-alignment:
  type: align.ThesisAlignment
  label: Persistent energy shock alignment
  forThesis: ws.persistent-energy-shock
  alignmentConfidence:
    estimateMean: 0.89
    estimateStdDev: 0.04
    betaAlpha: 53.6
    betaBeta: 6.6
  alignmentRationale: |
    Long-energy stack: [[sec.xle]] primary, [[sec.xom]] / [[sec.cvx]] alternates. The structural fit is unchanged - these three participate in an energy premium exactly as strongly as they did - but this refresh is the one where the mechanism actually re-engaged. [[ws.ev-iran-ceasefire-expired-aug17|The 60-day window lapsed with no deal]], [[ws.ev-us-naval-blockade-reimposed-aug|the blockade returned]], [[ws.ev-hormuz-traffic-new-low-aug17|transit hit a new low]], and [[ws.ev-xle-6229-aug27|the sector recovered the entire July unwind]]. alignmentConfidence nudges to 0.89 on the fresh sec.xle-tagged evidence. Ranks, roles, and directions unchanged - the thesis-confidence re-rate from 0.45 to 0.75 lives in the snapshot band, not here.
  hasAlignedSecurity:
    - alignedSecurity: sec.xle
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.91
        estimateStdDev: 0.03
        betaAlpha: 81.9
        betaBeta: 8.1
      securityRationale: |
        Long [[sec.xle]] is the canonical sector-ETF expression - named in thesisStatement and carrying the window's directly-tagged print, [[ws.ev-xle-6229-aug27|62.29 on August 27 with XOM 156.44 and CVX 199.77]]. Broad diversified exposure across integrated majors, refiners and services matches the structural-supply read rather than singling out one operator. Tightest band in the stack: lowest idiosyncratic risk and the cleanest argument.
    - alignedSecurity: sec.xom
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.85
        estimateStdDev: 0.05
        betaAlpha: 42.5
        betaBeta: 7.5
      securityRationale: |
        Long [[sec.xom]] is the largest-integrated-major single-name alternate to [[sec.xle|XLE]] - same upstream-plus-downstream exposure, more concentrated on company-specific reserves and operating leverage. Held at 0.85; the modest band reflects the single-name concentration premium relative to the ETF.
    - alignedSecurity: sec.cvx
      securityRole: align.role-alternate-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.83
        estimateStdDev: 0.05
        betaAlpha: 46.0
        betaBeta: 9.4
      securityRationale: |
        Long [[sec.cvx]] is the second integrated-major alternate, structurally similar to [[sec.xom|XOM]] with a different reserve mix and a somewhat more defensive balance sheet. Ranked third on slightly lower upstream beta to a crude spike, which is the specific channel this thesis expresses.

iran-war-rearmament-alignment:
  type: align.ThesisAlignment
  label: Iran war rearmament alignment
  forThesis: ws.iran-war-rearmament
  alignmentConfidence:
    estimateMean: 0.88
    estimateStdDev: 0.04
