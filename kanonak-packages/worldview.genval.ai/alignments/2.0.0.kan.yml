    betaBeta: 7.8
  alignmentRationale: |
    Defense-prime stack: [[sec.lmt]] primary, [[sec.rtx]] / [[sec.noc]] alternates. This is the window where the procurement leg produced hard, security-tagged evidence rather than budget headlines - [[ws.ev-lmt-q2-2026-backlog-230b|a record $230.4B backlog on $65B of new orders]] and [[ws.ev-lmt-thaad-35b-multiyear|a $35B multi-year THAAD award]]. That evidence density is specific to LMT, so it separates from the alternates and its band tightens. alignmentConfidence steps to 0.88. Roles and directions unchanged; the ceasefire lapse moves thesis confidence, not structural fit.
  hasAlignedSecurity:
    - alignedSecurity: sec.lmt
      securityRole: align.role-primary-vehicle
      allocationDirection: align.direction-long
      alignmentStrength:
        estimateMean: 0.91
        estimateStdDev: 0.03
        betaAlpha: 81.9
        betaBeta: 8.1
      securityRationale: |
        Long [[sec.lmt]] steps from 0.89 on the strongest evidence density any name carries this refresh: [[ws.ev-lmt-q2-2026-backlog-230b|the record backlog and raised guidance]], [[ws.ev-lmt-thaad-35b-multiyear|the THAAD award that nearly doubled Missiles and Fire Control backlog to $87.9B]], and [[ws.ev-defense-closes-aug27|a 565.89 close still well below the 692.00 fifty-two-week high]]. Contracted multi-year backlog is exactly the mechanism the thesis claims. Band tightens to 0.03.
