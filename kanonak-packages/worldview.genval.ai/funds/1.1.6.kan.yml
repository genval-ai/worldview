  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.stagflation-risk
    - ws.persistent-energy-shock
  holdingRationale: |
    7.00% long, down from 7.37% (-5.0%). The direct commodity leg of [[ws.persistent-energy-shock]], which eased 0.90 to 0.86 as [[ws.ev-araghchi-seven-day-hormuz-plan-sep23|Iran delivered a seven-day reopening plan]] and [[ws.ev-saudi-east-west-pipeline-restart-sep22|the Saudi pipeline restarted]]. It stays at the top because it carries two distinct energy channels plus a stagflation inflation channel. Driver-union dedup: `inflation-debasement` is shared, counted once at [[ws.stagflation-risk]], while its other channels add.

