funds:
  type: Package
  publisher: worldview.genval.ai
  version: 1.1.6
  label: Fund data - driver-union reweight against snapshot 4.0.4 + alignments 2.0.4
  comment: >-
    Patch reweight of the public fund data, re-derived by the driver-union method from
    alignments 2.0.4 against worldview snapshot 4.0.4 (Friday September 25 - the 10Y
    reached 5.223% and the 30Y 5.501% with October hike odds near two-thirds; the Saudi
    East-West pipeline restarted and the US and Iran explored a phased Hormuz reopening
    before a Houthi barrage on Yanbu put Brent back to $106.60; AMD crossed $1 trillion and
    the Nasdaq-100 set a record). Same seven active theses and same method as 1.1.5, so a
    patch; the holding set turns over through the alignment re-rank - MU and QQQ enter,
    INTC leaves - for 24 holdings. Energy and defense are trimmed, the AI sleeve and the
    duration shorts grow, and net exposure is flat at 74.9 percent. No securities bump.
    Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
    - publisher: worldview.genval.ai
      packages:
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: alignments
          match: '='
          version: 2.0.4
          alias: ca
        - package: securities
          match: ^
          version: 2.4.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.0.4
          alias: ws

genval-worldview-fund:
  type: fund.Fund
  label: "Genval Worldview Fund (1.1.6 - driver-union reweight against snapshot 4.0.4 and alignments 2.0.4; diplomacy trims energy and defense, the rate regime and the AI rally grow the duration shorts and the AI sleeve, MU and QQQ enter and INTC leaves; 24 holdings, gross 0.9999, net 0.7491, cash 0.1255)"
  fundObservedAt: 2026-09-25T12:35:12Z
  fund.derivedFromSnapshot: ws.view
  derivedFromAlignment: ca.view
  weightingMethod: fund.method-driver-union
  grossExposure: 0.9999
  netExposure: 0.7491
  cashWeight: 0.1255
  fundNarrative: |
    Driver-union reweight from [[ca.view|alignments 2.0.4]] against [[ws.view|worldview snapshot 4.0.4]] (observedAt 2026-09-25T12:18:32Z). Same seven `wv.active` theses and the same `fund.method-driver-union` as 1.1.5, so this is a patch; the holding set turns over by the alignment's re-rank - [[sec.mu]] and [[sec.qqq]] enter, [[sec.intc]] leaves - for 24 holdings. Gross 0.9999, net 0.7491, cash 0.1255.

    **The book rotates from geopolitics to rates and AI.** The theses that fell were the ones where diplomacy opened a path to invalidation: [[ws.persistent-energy-shock]] 0.90 to 0.86 on [[ws.ev-araghchi-seven-day-hormuz-plan-sep23|a seven-day Iranian reopening plan]] and [[ws.ev-saudi-east-west-pipeline-restart-sep22|the Saudi pipeline restart]], and [[ws.iran-war-rearmament]] 0.91 to 0.88 on [[ws.ev-cr-dec11-no-iran-supplemental-sep1|a stopgap without the war supplemental]]. The theses that rose were the rate regime and the AI cycle: [[ws.hawkish-warsh-regime]] 0.93 to 0.94 on [[ws.ev-10y-5223-sep24|a 5.223% ten-year]], and [[ws.ai-capex-cycle-with-china-tail]] 0.90 to 0.92 on [[ws.ev-ai-complex-closes-sep24|an AI rally through the yield spike]]. Every energy and defense leg is trimmed; NVDA, AMD and both duration shorts grow.

    **Energy still leads, but its margin narrowed.** [[sec.uso]] 7.00% and [[sec.xle]] 6.70% stay first and second on two distinct energy channels plus a stagflation inflation channel, deduped once. The energy theme lost 1.3 points of gross (23.0% to 21.7%) while AI gained 0.4 (21.3% to 21.7%), so the two themes are now level to within two basis points.

    **The duration shorts are the only legs that grew on both inputs.** [[sec.tlt]] -5.24% and [[sec.ief]] -4.46%: the regime thesis firmed and the alignment firmed both shorts. Their `rate-path` and `monetary-credibility` channels are counted once at the regime thesis and `inflation-debasement` once at stagflation, so the book does not stack two theses' worth of the same rate bet.

    **Turnover.** [[sec.mu]] enters at 3.84%, replacing [[sec.intc]]'s 3.39% as the AI high-beta proxy, and [[sec.qqq]] enters at 2.92% as the equity basket's melt-up proxy. QQQ's largest constituents are the AI sleeve's names, but QQQ reaches the book only through [[ws.equity-melt-up-vs-recession-risk]]'s drivers while the single names come through [[ws.ai-capex-cycle-with-china-tail]]'s. The union dedupes a security within a shared driver, not overlapping constituents across securities, so that look-through overlap is not netted - it is real exposure and is disclosed here.

    **Theme rollup by gross weight.** Energy 21.71% (USO, XLE, XOM, CVX); AI 21.69% (NVDA, AMD, AVGO, ORCL, MU); Defense 13.01% (LMT, RTX, NOC); Gold 12.96% (GLD, IAU, GDX); Equity long 12.24% (SPY, VTI, QQQ, UVIX); Equity short 2.84% (IWM); Duration shorts 9.70% (TLT, IEF); Managed futures 5.84% (DBMF, KMLM). Net 74.9%, essentially unchanged from 74.9% - the energy and defense trims are offset by the new long entries, and the larger duration shorts are offset by a smaller IWM short.
  hasHolding:
    - holding-uso
    - holding-xle
    - holding-gld
    - holding-tlt
    - holding-nvda
    - holding-amd
    - holding-lmt
    - holding-ief
    - holding-avgo
    - holding-rtx
    - holding-noc
    - holding-xom
    - holding-iau
    - holding-orcl
    - holding-cvx
    - holding-mu
    - holding-gdx
    - holding-spy
    - holding-dbmf
    - holding-uvix
    - holding-vti
    - holding-qqq
    - holding-iwm
    - holding-kmlm

