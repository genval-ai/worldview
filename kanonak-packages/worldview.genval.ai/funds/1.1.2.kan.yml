funds:
  type: Package
  publisher: worldview.genval.ai
  version: 1.1.2
  label: Fund data - driver-union reweight against snapshot 4.0.0 + alignments 2.0.0
  comment: >-
    Patch reweight of the public fund data, re-derived by the driver-union method from
    alignments 2.0.0 against worldview snapshot 4.0.0 (Friday August 28 - the 60-day
    US-Iran ceasefire lapsed on August 17 with no deal and the naval blockade was
    reimposed, taking WTI back to ~$82.55; the July 29 FOMC held 9-3 over three hawkish
    dissents with the 30Y at 2007 highs; gold recovered on record 289t Q2 central-bank
    buying; NVIDIA printed a record $89.0B data-center quarter). PATCH despite the major
    upstream bumps: the fund's rule keys on the active thesis set and the weighting
    method, and both are unchanged - same seven theses, same 21 holdings, same
    driver-union method. The energy re-rate (0.45 to 0.75) is the whole story: XLE 6.24
    to 7.46 percent takes the top weight back from GLD and flips to primary-vehicle,
    XOM 2.78 to 4.21 and CVX 2.72 to 4.11 gain most as undeduped single-thesis holdings,
    and everything else trims on renormalisation against a fixed 1.00 gross budget.
    No securities bump. Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
    - publisher: worldview.genval.ai
      packages:
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: alignments
          match: '='
          version: 2.0.0
          alias: ca
        - package: securities
          match: ^
          version: 2.3.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.0.0
          alias: ws

genval-worldview-fund:
  type: fund.Fund
  label: "Genval Worldview Fund (1.1.2 - driver-union reweight against snapshot 4.0.0 + alignments 2.0.0; the Iran ceasefire lapse re-rates energy 0.45 to 0.75 and XLE 7.46% takes the top weight back from GLD 6.86%, with XOM and CVX gaining most as undeduped single-thesis holdings; 21 holdings, gross 100.0%, net +81.9% long, cash 9.0%)"
  fundObservedAt: 2026-08-28T13:44:00Z
  fund.derivedFromSnapshot: ws.view
  derivedFromAlignment: ca.view
  weightingMethod: fund.method-driver-union
  grossExposure: 1.00
  netExposure: 0.8193
  cashWeight: 0.0904
  fundNarrative: |
    **Genval Worldview Fund - driver-union reweight (1.1.2).** Re-derived from [[ca.view|thesis-alignments 2.0.0]] against [[ws.view|snapshot 4.0.0]] by the **driver-union** method (each contributing thesis's signed conviction is spread across its normalised macro-driver loadings, combined by MAX within a driver so a shared force counts once, summed across distinct drivers, then normalised to a 1.00 gross budget). Twenty-one holdings, gross 100.0%, net **+81.9%** long, cash 9.0%.

    **This is a PATCH despite a major upstream.** The snapshot went 3.0.1 to 4.0.0 and the alignment 1.1.1 to 2.0.0, but the fund's own bump rule keys on the active thesis set and the weighting method - both unchanged. Same seven theses, same 21 names, same driver-union method. What changed is the weights.

    **The energy sleeve re-rates and takes the top of the book.** [[ws.persistent-energy-shock]] moved 0.45 to 0.75 after [[ws.ev-iran-ceasefire-expired-aug17|the 60-day ceasefire lapsed with no deal]] and [[ws.ev-us-naval-blockade-reimposed-aug|the blockade returned]]. [[sec.xle]] (**7.46%**, from 6.24%) takes the top weight back from [[sec.gld]], and its role FLIPS to primary-vehicle because energy (0.75 x 0.91) now outranks [[ws.stagflation-risk]] (0.89 x 0.64) as its dominant channel. [[sec.xom]] (**4.21%**, from 2.78%) and [[sec.cvx]] (**4.11%**, from 2.72%) gain most in proportional terms: single-thesis holdings, so the full +0.30 re-rate flows through with no dedupe. The energy complex adds roughly 4 percentage points of gross, funded by proportional trims across the rest of the book.

    **Everything else trims on renormalisation, not conviction.** Five of the seven theses gained confidence this window, but gross is fixed at 1.00, so a sleeve growing 4pp mechanically shrinks the others. [[sec.nvda]] falls to 5.47% on the strongest print it has ever had; [[sec.gld]] falls to 6.86% while its thesis rose 0.85 to 0.90. Read these as renormalisation, not de-rating. [[sec.gdx]] is the tell: its weight is unchanged to four decimals because its strength gain (0.76 to 0.79) exactly offsets the drag.

    **The rate shorts are where the union does the most work.** [[sec.tlt]] (**-4.84%**) and [[sec.ief]] (**-4.19%**) each serve [[ws.stagflation-risk]] and [[ws.hawkish-warsh-regime]], and those two theses share THREE drivers - `rate-path`, `monetary-credibility` and `inflation-debasement`. All three dedupe by MAX, so the second thesis contributes almost nothing and the legs barely move despite both theses gaining confidence and both alignment strengths stepping up. Under the old conviction-weighted SUM this book would carry roughly double the intended short duration against a single macro force.

    **Concentration and dedupe summary.** Long: energy 15.8% ([[sec.xle]] / [[sec.xom]] / [[sec.cvx]]), AI 24.6% ([[sec.nvda]] / [[sec.amd]] / [[sec.avgo]] / [[sec.orcl]] / [[sec.intc]]), gold 16.7% ([[sec.gld]] / [[sec.iau]] / [[sec.gdx]]), defense 15.2% ([[sec.lmt]] / [[sec.rtx]] / [[sec.noc]]), equity beta 8.6%, trend carry 6.5%, vol hedge 3.6%. Short: 9.0% across the rate complex. The deduped names are [[sec.gld]] and [[sec.xle]] (gold / energy against stagflation on `inflation-debasement`) and the rate complex [[sec.tlt]] / [[sec.ief]] / [[sec.dbmf]] (stagflation against hawkish-Warsh on three shared drivers). No securities bump.
  hasHolding:
    - holding-xle
    - holding-gld
    - holding-nvda
    - holding-lmt
    - holding-amd
    - holding-rtx
    - holding-iau
    - holding-avgo
    - holding-tlt
    - holding-noc
    - holding-orcl
    - holding-gdx
    - holding-spy
    - holding-xom
    - holding-ief
    - holding-vti
    - holding-cvx
    - holding-intc
    - holding-dbmf
    - holding-uvix
    - holding-kmlm

