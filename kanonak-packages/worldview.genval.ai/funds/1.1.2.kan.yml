    - ws.persistent-energy-shock
  holdingRationale: |
    Top weight (**7.46%**, up from 6.24%) and now the book's largest position, taking the top slot back from [[sec.gld]]. Its dominant channel FLIPS this reweight: [[ws.persistent-energy-shock]] (0.75 x 0.91) now exceeds [[ws.stagflation-risk]] (0.89 x 0.64), so the role reads primary-vehicle rather than the stagflation passthrough leg it was at 1.1.1. `energy-supply` and `geopolitical-conflict` add as distinct drivers while `inflation-debasement` MAX-dedupes against stagflation.

