  holdingRationale: |
    Twentieth weight at 3.17%, down 5.9% - the thesis eased and [[ca.view|the alignment]] eased it 0.76 to 0.75 because the small-cap tail it carries [[ws.ev-spy-qqq-iwm-sep15|underperformed for a fourth consecutive window]]. An unqualified total-market leg remains partially self-cancelling against the short [[sec.iwm]] leg in the same basket.

holding-dbmf:
  type: fund.Holding
  heldSecurity: sec.dbmf
  targetWeight: 0.0308
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
