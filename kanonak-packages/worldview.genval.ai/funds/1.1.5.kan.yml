funds:
  type: Package
  publisher: worldview.genval.ai
  version: 1.1.5
  label: Fund data - driver-union reweight against snapshot 4.0.3 + alignments 2.0.3
  comment: >-
    Patch reweight of the public fund data, re-derived by the driver-union method from
    alignments 2.0.3 against worldview snapshot 4.0.3 (Wednesday September 16 - the Fed
    raised the target range 25bp to 3.75-4.00% on a 12-0 vote, the first hike since July
    2023, with the dots showing one more; the 10Y closed at 5.00% for the first time since
    2007; Saudi Arabia shut the East-West pipeline after Iraqi-launched drone strikes and
    the Salalah corridor talks collapsed with Brent settling $108.75; August CPI ran 3.4%
    headline against 2.4% core; gold fell to a five-week low). Same seven active theses,
    same 23 holdings and same method as 1.1.4, so a patch. The book rotates rather than
    grows: energy and the duration shorts gain, gold and the AI complex give back, and the
    defense basket is flat. USO extends its lead at the top (7.37%), TLT is the largest
    short at -5.19%, and net exposure eases 75.9 to 74.9 percent as all three short legs
    grow. No securities bump. Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
    - publisher: worldview.genval.ai
      packages:
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: alignments
          match: '='
          version: 2.0.3
          alias: ca
        - package: securities
          match: ^
          version: 2.4.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.0.3
          alias: ws

genval-worldview-fund:
  type: fund.Fund
  label: "Genval Worldview Fund (1.1.5 - driver-union reweight against snapshot 4.0.3 and alignments 2.0.3; the Fed hiked and the duration shorts grow to -5.19% and -4.40%, energy extends its lead with USO at the top on a shut Saudi pipeline and collapsed corridor talks, gold and the AI complex give back on a 5% ten-year, and net exposure eases 75.9 to 74.9 percent)"
  fundObservedAt: 2026-09-16T19:56:27Z
  fund.derivedFromSnapshot: ws.view
  derivedFromAlignment: ca.view
  weightingMethod: fund.method-driver-union
  grossExposure: 0.9999
  netExposure: 0.7489
  cashWeight: 0.1256
  fundNarrative: |
    Driver-union reweight from [[ca.view|alignments 2.0.3]] against [[ws.view|worldview snapshot 4.0.3]] (observedAt 2026-09-16T19:33:57Z). Same seven `wv.active` theses, the same 23 holdings and the same `fund.method-driver-union` as 1.1.4, so this is a patch. Gross 0.9999 (the rounding residual of 23 four-decimal weights), net 0.7489, cash 0.1256.

    **This is a rotation, not a growth.** No holding enters or leaves, so every weight change is a change of view rather than a renormalisation artefact. The movers against a flat book: [[sec.kmlm]] +7.8%, [[sec.xom]] +7.5%, [[sec.dbmf]] +7.3%, [[sec.cvx]] +6.0%, [[sec.uso]] +5.6%, [[sec.tlt]] +5.5% and [[sec.ief]] +5.0% (both shorts growing), against [[sec.gdx]] -6.6%, [[sec.gld]] -6.4%, [[sec.vti]] -5.9%, [[sec.intc]] -5.8%, [[sec.spy]] -4.8% and the three AI leaders about -4% each. The defense basket is within a point of flat.

    **The headline is that the regime thesis's prediction was delivered and the book leans further into it.** [[ws.ev-fomc-sep16-hike-375-400|The FOMC raised the target range to 3.75-4.00% on a 12-0 vote]] with [[ws.ev-fomc-sep16-sep-one-more-hike|one more hike projected and no cut before 2028]], after [[ws.ev-10y-500-sep15|the ten-year closed at 5.00%]]. [[ws.hawkish-warsh-regime]] stepped 0.89 to 0.93 and [[ca.view|the alignment]] firmed both duration shorts, so [[sec.tlt]] grows to -5.19% and [[sec.ief]] to -4.40%. Both remain the most heavily deduplicated positions in the book: their two theses ([[ws.hawkish-warsh-regime]] and [[ws.stagflation-risk]]) load an identical driver set - `rate-path`, `monetary-credibility`, `inflation-debasement` - so MAX-within-driver counts each channel once. The hawkish thesis now wins the `rate-path` and `monetary-credibility` channels outright while stagflation still supplies the `inflation-debasement` channel; a naive SUM would size TLT near -9.5%. One caution carried up from the alignment: [[ws.ev-fed-day-yields-gold-oil-sep16|the long end rallied four basis points on the decision]], and a market that buys duration on a delivered hike is beginning to price the end of the path these shorts express.

    **Energy extends its lead because its only path to invalidation closed.** [[ws.ev-saudi-east-west-pipeline-shut-sep11|Saudi Arabia shut the East-West pipeline after Iraqi-launched drone strikes]], [[ws.ev-salalah-ministerial-postponed-sep13|the Salalah corridor ministerial collapsed]], and [[ws.ev-brent-10875-sep15|Brent settled $108.75]]. [[ws.persistent-energy-shock]] stepped 0.85 to 0.90 and this time the equities followed the commodity - [[ws.ev-uso-energy-complex-sep15|USO up 3.7%, XOM 3.1%, CVX 1.9%]] - so every energy leg was marked back up. [[sec.uso]] holds the top weight at 7.37% with [[sec.xle]] second at 7.15%; the two draw on the same five drivers through their energy and stagflation memberships and dedupe with [[ws.stagflation-risk]] on `inflation-debasement` alone, counted at the stagflation thesis's stronger loading. [[sec.xom]] and [[sec.cvx]] are the largest relative gainers among the longs because they serve only the energy thesis and so carry no dedupe against a thesis that eased.

    **Gold gives back for the reason it gained last time.** [[ws.gold-debasement-bid]] fell 0.89 to 0.86 because [[ws.ev-gold-five-week-low-sep14|gold fell to a five-week low on rising real yields]] and [[ws.ev-fed-day-yields-gold-oil-sep16|fell again on the hike]], and [[ca.view|the alignment]] cut [[sec.gld]] inside the stagflation basket 0.60 to 0.52 for selling off on the inflation repricing a second time. GLD eases to 5.52% - still third in the book, because its `inflation-debasement` and `monetary-credibility` channels are counted once at the gold thesis's stronger loading and the stagflation membership adds only the `rate-path` channel. [[sec.gdx]] is the largest relative loser in the book at -6.6% after [[ws.ev-gld-gdx-sep15|the miners fell 5.4% against bullion's 2.3%]].

    **The AI complex is trimmed on cost of capital, not on demand.** [[ws.ai-capex-cycle-with-china-tail]] eased 0.92 to 0.90 and the alignment marked four of five legs down after [[ws.ev-ai-complex-closes-sep15|NVDA fell 5.5% and AVGO 7.6% from September 2]] into the 5% ten-year, even as [[ws.ev-orcl-q1-fy27-oci-121pct-sep10|Oracle reported 121% cloud-infrastructure growth and $664B of RPO]]. [[sec.orcl]] is the one AI holding that is flat rather than down - the alignment raised it on the densest evidence in the basket while widening its band on [[ws.ev-orcl-capex-28b-fcf-neg-5b-sep10|$28B of quarterly capex, negative free cash flow and a $20B equity raise]]. The coupling flagged in 1.1.4 stands and is now visible in price: the long AI book (about 21% of gross) and the short duration book (about 10% of gross) are partially the same trade from two ends, and the union does not dedupe them because the AI thesis carries no `rate-path` loading. If a future snapshot adds one, both books trim together.

    **The equity basket rotates toward its downside legs.** [[ws.equity-melt-up-vs-recession-risk]] eased 0.77 to 0.74 and the alignment firmed short [[sec.iwm]] and the [[sec.uvix]] hedge while easing [[sec.vti]]; the thesis's confidence decline outweighs those strength gains for the hedge, so UVIX still eases 2% while IWM grows 1%. [[sec.spy]] and VTI trim about 5% each. [[ws.ev-vix-1720-sep15|The VIX at 17.20]] leaves both invalidation legs unfired.

    **Theme rollup by gross weight.** Energy 23.0% (USO, XLE, XOM, CVX) remains the largest theme. AI 21.3% (NVDA, AMD, AVGO, ORCL, INTC). Defense 13.8% (LMT, RTX, NOC), flat. Gold 13.6% (GLD, IAU, GDX). Equity beta 10.0% long (SPY, VTI, UVIX) against a 2.96% short IWM leg. Duration shorts 9.6% (TLT, IEF). Managed futures 5.8% (DBMF, KMLM). The short book is 12.55% of gross across three legs, up from 12.04%, which is what takes net exposure 75.9 to 74.9 percent.
  hasHolding:
    - holding-uso
    - holding-xle
    - holding-gld
    - holding-tlt
    - holding-lmt
    - holding-rtx
    - holding-nvda
    - holding-amd
    - holding-avgo
    - holding-noc
    - holding-ief
    - holding-xom
    - holding-iau
    - holding-cvx
    - holding-orcl
    - holding-gdx
    - holding-spy
    - holding-intc
    - holding-uvix
    - holding-vti
    - holding-dbmf
    - holding-iwm
    - holding-kmlm

holding-uso:
  type: fund.Holding
  heldSecurity: sec.uso
  targetWeight: 0.0737
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.persistent-energy-shock
    - ws.stagflation-risk
  holdingRationale: |
    Top weight at 7.37%, up 5.6% from 6.98%. Both theses that cite it moved its way: [[ws.persistent-energy-shock]] stepped 0.85 to 0.90 as [[ws.ev-saudi-east-west-pipeline-shut-sep11|the Saudi bypass pipeline was shut]] and [[ws.ev-salalah-ministerial-postponed-sep13|the corridor talks collapsed]], and [[ca.view|the alignment]] raised it in both baskets (0.86 to 0.88 in energy, 0.68 to 0.72 in stagflation) on [[ws.ev-uso-energy-complex-sep15|a 3.7% window gain]] and [[ws.ev-aug-cpi-headline-34-sep11|a CPI energy index up 16.3% year-over-year]]. Draws on five distinct drivers and dedupes with [[ws.stagflation-risk]] only on `inflation-debasement`, counted once at the stagflation thesis's stronger loading. Still **alternate-vehicle** by role because the equities re-tracked crude this window and XLE kept the primary slot.

holding-xle:
  type: fund.Holding
  heldSecurity: sec.xle
  targetWeight: 0.0715
  holdingDirection: align.direction-long
  holdingRole: align.role-primary-vehicle
  servesThesis:
    - ws.persistent-energy-shock
    - ws.stagflation-risk
  holdingRationale: |
    Second weight at 7.15%, up 2.7%. The decoupling that marked it down last reweight did not persist - [[ws.ev-uso-energy-complex-sep15|XLE closed 65.93 against 65.31 with XOM up 3.1% and CVX 1.9%]] as [[ws.ev-brent-10875-sep15|Brent reached its highest close in nearly four months]] - so [[ca.view|the alignment]] nudged it back up in both baskets and it retains **primary-vehicle**. Gains less than USO because the alignment moved it one point where USO moved two to four. Same five-driver structure and the same single-channel dedupe with [[ws.stagflation-risk]].

holding-gld:
  type: fund.Holding
  heldSecurity: sec.gld
  targetWeight: 0.0552
  holdingDirection: align.direction-long
  holdingRole: align.role-primary-vehicle
  servesThesis:
    - ws.gold-debasement-bid
    - ws.stagflation-risk
  holdingRationale: |
    Third weight at 5.52%, down 6.4% from 5.90% - the second-largest genuine trim in the book. Both of its theses moved against it: [[ws.gold-debasement-bid]] fell 0.89 to 0.86 after [[ws.ev-gold-five-week-low-sep14|gold fell to a five-week low on rising real yields]], and [[ca.view|the alignment]] cut it inside the stagflation basket 0.60 to 0.52 for selling off on the inflation repricing a second time. It holds third place because its two largest channels, `inflation-debasement` and `monetary-credibility`, are counted once at the gold thesis's stronger loading, and the stagflation membership still adds a distinct `rate-path` channel. Retains **primary-vehicle** inside its own basket at 0.92 - the thesis fell, not the vehicle's fit to it.

holding-tlt:
  type: fund.Holding
  heldSecurity: sec.tlt
  targetWeight: -0.0519
  holdingDirection: align.direction-short
  holdingRole: align.role-inverse-expression
  servesThesis:
    - ws.hawkish-warsh-regime
    - ws.stagflation-risk
  holdingRationale: |
    Largest short and fourth weight overall at -5.19%, up 5.5% from -4.92%. The event the leg was built for was delivered: [[ws.ev-fomc-sep16-hike-375-400|a 25bp hike on a 12-0 vote]] with [[ws.ev-fomc-sep16-sep-one-more-hike|one more projected]], after [[ws.ev-10y-500-sep15|a 5.00% ten-year close]] and [[ws.ev-tlt-8071-ief-9082-sep15|a new cycle low of 80.71]]. [[ws.hawkish-warsh-regime]] stepped 0.89 to 0.93 and [[ca.view|the alignment]] raised it in both baskets (0.81 to 0.84 and 0.75 to 0.78). **The most heavily deduplicated position in the book**: its two theses load an identical driver set, so MAX-within-driver counts each channel exactly once - the hawkish thesis now wins `rate-path` and `monetary-credibility` while stagflation supplies `inflation-debasement`. A naive SUM would size this near -9.5%. Caution from the alignment: [[ws.ev-fed-day-yields-gold-oil-sep16|the long end rallied four basis points on the decision]].

holding-lmt:
  type: fund.Holding
  heldSecurity: sec.lmt
  targetWeight: 0.0473
  holdingDirection: align.direction-long
  holdingRole: align.role-primary-vehicle
  servesThesis:
    - ws.iran-war-rearmament
  holdingRationale: |
    Fifth weight at 4.73%, flat, and up two ranks as the AI leaders trimmed around it. [[ws.iran-war-rearmament]] stepped 0.90 to 0.91 with its alignment strength held at 0.91 - the war widened to three fronts and [[ws.ev-defense-closes-sep15|LMT rose 1.7% through it]], the first escalation window in three in which the primes rose. Single-thesis, single-driver holding on `geopolitical-conflict`, which is why the defense names sit mid-book at high conviction: one channel to contribute through. **Primary-vehicle** on twenty-four strong evidence mentions.

holding-rtx:
  type: fund.Holding
  heldSecurity: sec.rtx
  targetWeight: 0.0462
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.iran-war-rearmament
  holdingRationale: |
    Sixth weight at 4.62%, down 1.1% - the thesis's one-point step offset by [[ca.view|the alignment]] easing it 0.90 to 0.89 because [[ws.ev-defense-closes-sep15|RTX slipped 1.0% while LMT and NOC rose]] and no new award attached this window. [[ws.ev-rtx-tomahawk-229b-aug17|The $22.9B Tomahawk contract]] remains the largest named award in the basket. Single-thesis, single-driver holding on `geopolitical-conflict`.

holding-nvda:
  type: fund.Holding
