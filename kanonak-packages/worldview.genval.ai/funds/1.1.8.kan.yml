  type: fund.Holding
  heldSecurity: sec.uso
  targetWeight: 0.0742
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.stagflation-risk
    - ws.persistent-energy-shock
  holdingRationale: |
    7.42% long, up from 7.22% (2.8%). The energy thesis firmed 0.88 to 0.91 as [[ws.ev-hormuz-flows-crash-attacks-oct14|Hormuz transits collapsed again]], and the alignment lifted USO to 0.88 after [[ws.ev-energy-complex-oct29|it rose 9.5% while the producers lagged]]; it extends its lead at the top. Driver-union dedup: `inflation-debasement` is shared, counted once at [[ws.stagflation-risk]], while its other channels add.

