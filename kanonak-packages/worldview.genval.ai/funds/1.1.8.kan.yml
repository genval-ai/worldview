funds:
  type: Package
  publisher: worldview.genval.ai
  version: 1.1.8
  label: Fund data - driver-union reweight against snapshot 4.1.0 + alignments 2.0.6
  comment: >-
    Patch reweight of the public fund data, re-derived by the driver-union method from
    alignments 2.0.6 against worldview snapshot 4.1.0 (Friday October 30 - record defense
    backlogs as PAC-3, Tomahawk and AMRAAM converted to multi-year contracts; Hormuz transits
    collapsed again and Brent rose about 13% in October to $114.88; the Fed held 10-2 with two
    dissents for a hike; Q3 GDP grew 3.4% with core PCE at 3.1%; hyperscaler capex set records
    without raised outlooks; gold fell as yields eased). Same seven active theses, same 24
    holdings and same method as 1.1.7, so a patch with no turnover. Defense gains about 10%
    per name, energy extends its lead through USO, and gold, AI and the duration and small-cap
    shorts give back; net exposure rises to 75.9 percent. No securities bump.
    Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
    - publisher: worldview.genval.ai
      packages:
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: alignments
          match: '='
          version: 2.0.6
          alias: ca
        - package: securities
          match: ^
          version: 2.4.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.1.0
          alias: ws

genval-worldview-fund:
  type: fund.Fund
  label: "Genval Worldview Fund (1.1.8 - driver-union reweight against snapshot 4.1.0 and alignments 2.0.6; defense gains about 10% per name on contracted munitions, energy extends its lead through USO on a re-closed Hormuz, and gold, AI and the duration and small-cap shorts give back; 24 holdings, gross 0.9998, net 0.7592, cash 0.1205)"
  fundObservedAt: 2026-10-30T14:38:49Z
  fund.derivedFromSnapshot: ws.view
  derivedFromAlignment: ca.view
  weightingMethod: fund.method-driver-union
  grossExposure: 0.9998
  netExposure: 0.7592
  cashWeight: 0.1205
  fundNarrative: |
    Driver-union reweight from [[ca.view|alignments 2.0.6]] against [[ws.view|worldview snapshot 4.1.0]] (observedAt 2026-10-30T14:01:59Z). Same seven `wv.active` theses, the same 24 holdings and the same `fund.method-driver-union` as 1.1.7, so this is a patch with no turnover. Gross 0.9998, net 0.7592, cash 0.1205.

    **Defense is the largest gain in the book.** [[ws.iran-war-rearmament]] stepped 0.86 to 0.92 on [[ws.ev-lmt-q3-backlog-292b-oct22|the PAC-3 multi-year]] and [[ws.ev-rtx-q3-backlog-340b-oct20|the Tomahawk and AMRAAM multi-years]], and the alignment firmed all three primes: [[sec.lmt]] 10.2% to 4.88%, [[sec.rtx]] 10.3% to 4.72%, [[sec.noc]] 7.8% to 4.41%. The theme rises from 12.80% to 14.01% of gross.

    **Energy extends its lead, through the commodity.** [[ws.persistent-energy-shock]] firmed 0.88 to 0.91 as [[ws.ev-hormuz-flows-crash-attacks-oct14|the strait closed again]] and [[ws.ev-brent-11488-oct29|Brent rose about 13% in October]]. The alignment moved weight toward [[sec.uso]] (2.8% to 7.42%) and away from [[sec.xle]] (-2.2% to 7.02%) as [[ws.ev-energy-complex-oct29|the commodity led the producers]]. The theme is 23.21% against 22.86%.

    **Gold, AI and the shorts give back.** [[ws.gold-debasement-bid]] eased to 0.79 and [[sec.gld]] falls -5.1% to 4.98%; [[ws.ai-capex-cycle-with-china-tail]] eased to 0.87 and the AI sleeve falls from 21.08% to 20.67%, with [[sec.orcl]] the one AI name up on [[ws.ev-orcl-investor-day-225b-oct28|its funding cap]]. The duration shorts shrink - [[sec.tlt]] to -5.05% - as [[ws.ev-uvix-tlt-ief-oct29|the long end retraced]], and the [[sec.iwm]] short falls -5.7% after [[ws.ev-spy-qqq-iwm-oct29|small caps rallied 4.7%]].

    **Theme rollup by gross weight.** Energy 23.21% (USO, XLE, XOM, CVX); AI 20.67% (NVDA, AMD, AVGO, ORCL, MU); Defense 14.01% (LMT, RTX, NOC); Gold 12.05% (GLD, IAU, GDX); Equity long 12.24% (SPY, VTI, QQQ, UVIX); Equity short 2.79% (IWM); Duration shorts 9.24% (TLT, IEF); Managed futures 5.77% (DBMF, KMLM). Net 75.9%, up from 75.0% as the short legs shrank.
  hasHolding:
    - holding-uso
    - holding-xle
    - holding-tlt
    - holding-gld
    - holding-lmt
    - holding-rtx
    - holding-xom
    - holding-noc
    - holding-nvda
    - holding-cvx
    - holding-amd
    - holding-avgo
    - holding-ief
    - holding-iau
    - holding-orcl
    - holding-mu
    - holding-spy
    - holding-gdx
    - holding-uvix
    - holding-dbmf
    - holding-vti
    - holding-iwm
    - holding-qqq
    - holding-kmlm

