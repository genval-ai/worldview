  holdingRationale: |
    Seventh weight at 4.72%, flat against dilution and down three ranks from fourth - not because conviction fell (its thesis rose 0.89 to 0.90 and its alignment strength held at 0.91) but because the energy vehicle swap and the AI re-rank pushed names above it. Single-thesis holding drawing on ONE driver, `geopolitical-conflict`, which is the structural reason the defense names sit mid-book: a single-driver thesis has one channel to contribute through, however strong it is. **Primary-vehicle** on twenty-three strong evidence mentions, the densest attribution in the snapshot.

holding-rtx:
