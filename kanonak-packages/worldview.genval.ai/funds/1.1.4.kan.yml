holding-vti:
  type: fund.Holding
  heldSecurity: sec.vti
  targetWeight: 0.0337
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.equity-melt-up-vs-recession-risk
  holdingRationale: |
    Nineteenth weight at 3.37% and the second-largest genuine trim in the book, down about 15% against dilution. [[ca.view|The alignment]] cut it 0.78 to 0.76 for a specific reason: total-market exposure carries the small- and mid-cap tail that [[ws.ev-iwm-breadth-sep9|underperformed by more than two percentage points this window]]. In a melt-up that is narrowing, whole-market breadth is a drag on the expression rather than a diversifier - and this book now shorts that tail explicitly through [[sec.iwm]], which makes an unqualified long-VTI leg partially self-cancelling.

holding-uvix:
  type: fund.Holding
  heldSecurity: sec.uvix
  targetWeight: 0.0328
  holdingDirection: align.direction-long
  holdingRole: align.role-hedge
  servesThesis:
    - ws.equity-melt-up-vs-recession-risk
  holdingRationale: |
    Twentieth weight at 3.28%, down about 12% against dilution. **Hedge** in the strict sense - insurance against [[ws.equity-melt-up-vs-recession-risk]] resolving to its downside, sized as protection rather than as a directional bet. [[ws.ev-vix-1644-sep9|The VIX at 16.44 and 16.08]] barely moved this window and sits between both invalidation thresholds, so the hedge is neither cheap nor urgent. Note the fund now carries two distinct forms of downside expression on this thesis: this hedge, and the short [[sec.iwm]] inverse-expression - they are not substitutes.

holding-iwm:
  type: fund.Holding
  heldSecurity: sec.iwm
  targetWeight: -0.0293
  holdingDirection: align.direction-short
  holdingRole: align.role-inverse-expression
  servesThesis:
    - ws.equity-melt-up-vs-recession-risk
  holdingRationale: |
    **New holding**, third short leg, and twenty-first weight at -2.93%. Enters because [[ca.view|the alignment]] found a clean typed expression for the recession-risk half of this tension thesis: [[ws.ev-iwm-breadth-sep9|the Russell 2000 fell 1.9% across the window and 0.8% more on September 10, against SPY at -0.4% and QQQ at +1.0%]], a divergence that has widened in two consecutive refreshes. **Inverse-expression** rather than hedge - this is the thesis taken directionally on the short side, not protection against being wrong. Its addition is what takes the fund's net exposure 80.4 to 75.9 percent. Sized modestly and with the basket's widest band because small caps are the most rate-sensitive index segment and would rally hardest on [[ws.ev-aug-ppi-core-02-sep10|the soft-core-PPI path toward a dovish hold]].

holding-dbmf:
  type: fund.Holding
  heldSecurity: sec.dbmf
  targetWeight: 0.0287
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.hawkish-warsh-regime
  holdingRationale: |
    Twenty-second weight at 2.87% and **the largest genuine trim of this reweight**, down about 25% against the dilution baseline. This is a membership effect, not a conviction effect: its alignment strength inside [[ws.hawkish-warsh-regime]] was held at 0.56, but [[ca.view|2.0.2]] dropped it from the stagflation basket under the five-candidate cap to admit [[sec.uso]], which expresses the now-measured passthrough channel far more directly than a trend wrapper does. Serving one thesis instead of two removes its entire second set of driver contributions. Managed futures harvests this regime with a lag rather than expressing it.

holding-kmlm:
  type: fund.Holding
  heldSecurity: sec.kmlm
  targetWeight: 0.0256
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.hawkish-warsh-regime
  holdingRationale: |
    Smallest weight in the book at 2.56%, flat against dilution with strength held at 0.50. Near-substitute for [[sec.dbmf|DBMF]] with a different manager and weighting scheme, retained for manager diversification within the trend-carry leg rather than for distinct thesis exposure. It served only [[ws.hawkish-warsh-regime]] in the prior reweight too, which is why it does not take the trim DBMF does.
