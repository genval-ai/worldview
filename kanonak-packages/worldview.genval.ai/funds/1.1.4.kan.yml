  holdingRationale: |
    Tenth weight at 4.41%, a relative gain of about 2% tracking its thesis from 0.86 to 0.89. Same bullion exposure as [[sec.gld|GLD]] at a lower expense ratio, and it participates in the same [[ws.ev-gold-etf-18b-august-inflow|record August ETF inflow]] that validates the vehicle class. Serves only [[ws.gold-debasement-bid]], so unlike GLD it takes no stagflation-basket dedupe - which is why the gap between the two is narrower here than their alignment strengths alone would imply.

