funds:
  type: Package
  publisher: worldview.genval.ai
  version: 1.1.4
  label: Fund data - driver-union reweight against snapshot 4.0.2 + alignments 2.0.2
  comment: >-
    Patch reweight of the public fund data, re-derived by the driver-union method from
    alignments 2.0.2 against worldview snapshot 4.0.2 (Thursday September 10 - the long
    end broke through a tripled Treasury buyback with the 30Y at 5.307%, August payrolls
    rebounded to +162K with +55K of upward revisions, August PPI ran 5.4% YoY on a 24.1%
    diesel surge while core softened to +0.2%, the Gulf war became a tanker war with Brent
    above $101, and gold's structural leg refreshed on a record $18B August ETF inflow).
    Same seven active theses and same method as 1.1.3, so a patch - but the book grows 21
    to 23 holdings as the alignment admitted two new vehicles. USO enters at top weight
    (6.98%) because energy equities decoupled from crude, and a short IWM leg (-2.93%)
    enters to carry the breadth deterioration. Every carried holding shows a smaller
    absolute weight purely because a fixed gross budget of 1.00 now spreads across 23
    names; the real movers against that dilution are DBMF (-25%, dropped from the
    stagflation basket), VTI and XLE (trimmed on vehicle-fit evidence), against relative
    gains in gold, the AI names and the duration shorts. Net falls 80.4 to 75.9 percent as
    the short book grows to three legs. No securities bump of its own - sec.uso and
    sec.iwm arrive from securities 2.4.0, produced by the same refresh. Superseded by the
    next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
    - publisher: worldview.genval.ai
      packages:
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: alignments
          match: '='
          version: 2.0.2
          alias: ca
        - package: securities
          match: ^
          version: 2.4.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.0.2
          alias: ws

genval-worldview-fund:
  type: fund.Fund
  label: "Genval Worldview Fund (1.1.4 - driver-union reweight against snapshot 4.0.2 and alignments 2.0.2; USO enters at top weight on the crude-versus-equity decoupling, a short IWM leg carries the breadth deterioration, DBMF is the largest trim after leaving the stagflation basket, and net exposure falls 80.4 to 75.9 percent as the short book grows to three legs)"
  fundObservedAt: 2026-09-10T16:25:42Z
  fund.derivedFromSnapshot: ws.view
  derivedFromAlignment: ca.view
  weightingMethod: fund.method-driver-union
  grossExposure: 1.0000
  netExposure: 0.7592
  cashWeight: 0.1204
  fundNarrative: |
    Driver-union reweight from [[ca.view|alignments 2.0.2]] against [[ws.view|worldview snapshot 4.0.2]] (observedAt 2026-09-10T16:01:06Z). Same seven `wv.active` theses and the same `fund.method-driver-union` as 1.1.3, so this is a patch. The book grows 21 to 23 holdings because the alignment admitted two new vehicles, and one holding left a basket. Gross 1.0000, net 0.7592, cash 0.1204.

    **Read the weight changes as ranks, not levels.** A fixed gross budget of 1.00 now spreads across 23 names rather than 21, so every carried holding shows a smaller absolute weight - roughly 10% smaller - purely from renormalisation. That is arithmetic, not a change of view. Against that 10% dilution baseline the genuine movers are: [[sec.dbmf]] down about 25%, [[sec.vti]] down 15%, [[sec.xle]] down 11%, [[sec.spy]] and [[sec.uvix]] down about 12%, against relative GAINS in [[sec.gld]], [[sec.gdx]], [[sec.amd]], [[sec.avgo]], [[sec.rtx]] and both duration shorts.

    **The headline change is a vehicle swap inside the strongest theme.** [[ws.persistent-energy-shock]] had its best window of the year, stepping 0.80 to 0.85, yet [[ws.ev-xle-energy-complex-sep9|XLE closed essentially flat while crude rose more than 10%]] and [[ws.ev-uso-plus106pct-window-sep9|USO gained 10.6%]]. Energy equities decoupled from the commodity the thesis is actually written about. [[ca.view|The alignment]] responded by admitting [[sec.uso]] to both the energy and stagflation baskets and marking [[sec.xle]] down in both, and the union carries that straight through: **USO enters at 6.98%, the largest single weight in the book**, with XLE second at 6.96%. The two are near-identical in size because they draw on the same five drivers - `energy-supply`, `geopolitical-conflict`, `inflation-debasement`, `rate-path`, `monetary-credibility` - and differ only in the strength the alignment assigns them.

    **The clearest dedupe in the book is the duration short.** [[sec.tlt]] is cited by both [[ws.hawkish-warsh-regime]] and [[ws.stagflation-risk]], and those two theses load an IDENTICAL driver set - `rate-path`, `monetary-credibility`, `inflation-debasement`. Every channel is shared, so MAX-within-driver counts each one once at its stronger thesis and nothing sums. TLT lands at -4.92% rather than the roughly -9% a naive conviction SUM would have produced. It still gains 6% relative to the dilution baseline, on [[ws.ev-treasury-buyback-tripled-6b-sep9|a tripled buyback that failed to cap the long end]]. [[sec.ief]] dedupes identically at -4.19%.

    **[[sec.dbmf]] is the largest genuine trim and it is a membership effect, not a conviction effect.** In 2.0.1 the managed-futures sleeve served both [[ws.stagflation-risk]] and [[ws.hawkish-warsh-regime]]; [[ca.view|2.0.2]] dropped it from the stagflation basket under the five-candidate cap to make room for [[sec.uso]], which expresses the now-measured passthrough channel far more directly. Serving one thesis instead of two costs it about 25% against the dilution baseline, down to 2.87%.

    **A coupling downstream consumers should not miss.** [[ws.ev-ai-debt-68pct-treasury-borrowing-sep10|Hyperscaler and NVIDIA debt issuance now equals roughly 68% of new long-duration Treasury borrowing in ten-year-equivalent terms]]. The long AI book (NVDA, AMD, AVGO, ORCL, INTC - about 22% of gross) and the short duration book (TLT, IEF - about 9% of gross) are therefore partially the same trade seen from two ends: AI capex is a source of the long-end supply the shorts are expressing. The driver-union does NOT currently dedupe this, because [[ws.ai-capex-cycle-with-china-tail]] loads `ai-capex-cycle` and `geopolitical-conflict` while the duration theses load `rate-path` - no shared driver, so the contributions sum as distinct forces. That is arguably correct (they ARE distinct mechanisms) but it is worth an explicit note: if a future snapshot tags the AI thesis with a `rate-path` loading, these positions will dedupe and both books will trim.

    **Theme rollup by gross weight.** Energy 25.9% (USO, XLE, XOM, CVX) is now the largest theme, overtaking AI at 22.1% (NVDA, AMD, AVGO, ORCL, INTC). Gold 14.4% (GLD, IAU, GDX). Defense 13.7% (LMT, RTX, NOC). Equity beta 10.4% long (SPY, VTI, UVIX) against a 2.93% short IWM leg. Duration shorts 9.1% (TLT, IEF). Managed futures 5.4% (DBMF, KMLM). The short book is now three legs and 12.04% of gross, up from two legs and 9.8%, which is what takes net exposure 80.4 to 75.9 percent.
  hasHolding:
    - holding-uso
    - holding-xle
    - holding-gld
    - holding-tlt
    - holding-nvda
    - holding-amd
    - holding-lmt
    - holding-rtx
    - holding-avgo
    - holding-iau
    - holding-noc
    - holding-orcl
    - holding-ief
    - holding-gdx
    - holding-xom
    - holding-cvx
    - holding-spy
    - holding-intc
    - holding-vti
    - holding-uvix
    - holding-iwm
    - holding-dbmf
    - holding-kmlm

holding-uso:
  type: fund.Holding
  heldSecurity: sec.uso
  targetWeight: 0.0698
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.persistent-energy-shock
    - ws.stagflation-risk
  holdingRationale: |
    **New holding and the largest weight in the book at 6.98%.** Enters because [[ca.view|the alignment]] concluded that energy equities stopped tracking the variable [[ws.persistent-energy-shock]] is written about: [[ws.ev-uso-plus106pct-window-sep9|USO gained 10.6% across the window]] while [[ws.ev-xle-energy-complex-sep9|XLE closed flat]]. Since the thesis's invalidation condition is a WTI threshold, a direct crude vehicle is the tighter structural fit. Draws on five distinct drivers - `energy-supply` and `geopolitical-conflict` from the energy thesis, `rate-path` and `monetary-credibility` from stagflation - and dedupes with [[ws.stagflation-risk]] only on the shared `inflation-debasement` channel, counted once at the stagflation thesis's stronger loading. Reaching top weight on a single evidence mention is a deliberate consequence of the union counting FORCES rather than mentions.

holding-xle:
  type: fund.Holding
  heldSecurity: sec.xle
  targetWeight: 0.0696
  holdingDirection: align.direction-long
  holdingRole: align.role-primary-vehicle
  servesThesis:
    - ws.persistent-energy-shock
    - ws.stagflation-risk
  holdingRationale: |
    Second weight at 6.96%, down from 7.85% and the third-largest genuine trim once dilution is netted out. Two things pulled it down: [[ca.view|the alignment]] marked it down in BOTH baskets it serves (0.91 to 0.88 in energy, 0.68 to 0.66 in stagflation) on [[ws.ev-xle-energy-complex-sep9|a flat week against a 10% crude move]], and [[sec.uso]] now draws on the same five drivers, so the theme's conviction spreads across two vehicles instead of one. Retains **primary-vehicle** on eighteen strong evidence mentions and superior liquidity. Dedupes with [[ws.stagflation-risk]] on `inflation-debasement` alone.

holding-gld:
  type: fund.Holding
  heldSecurity: sec.gld
  targetWeight: 0.0590
  holdingDirection: align.direction-long
  holdingRole: align.role-primary-vehicle
  servesThesis:
    - ws.gold-debasement-bid
    - ws.stagflation-risk
  holdingRationale: |
    Third weight at 5.90%, and a relative GAIN of about 3% once the 23-name dilution is netted out - a reversal of the trim it took last reweight. Both of its theses improved: [[ws.gold-debasement-bid]] recovered 0.86 to 0.89 on [[ws.ev-gold-etf-18b-august-inflow|a record $18B August ETF inflow]] and [[ws.ev-pboc-gold-22-months-august|a 22nd consecutive month of PBoC buying]], and [[ca.view|the alignment]] partially rehabilitated it inside the stagflation basket (0.55 to 0.60) because it [[ws.ev-gold-4399-sep9|held its bid while real yields rose]], the opposite of the behaviour that got it demoted. Dedupes on two shared drivers - `inflation-debasement` and `monetary-credibility` - each counted once at the gold thesis's stronger channel, which is why it sits below the energy pair despite comparable conviction.

holding-tlt:
  type: fund.Holding
  heldSecurity: sec.tlt
  targetWeight: -0.0492
  holdingDirection: align.direction-short
  holdingRole: align.role-inverse-expression
  servesThesis:
    - ws.hawkish-warsh-regime
    - ws.stagflation-risk
  holdingRationale: |
    Largest short and fourth weight overall at -4.92%, a relative gain of about 6% against the dilution baseline. [[ca.view|The alignment]] raised it in both baskets (0.78 to 0.81 in hawkish-Warsh, 0.72 to 0.75 in stagflation) on the cleanest evidence available: [[ws.ev-treasury-buyback-tripled-6b-sep9|Treasury tripled its long-dated buyback specifically to cap borrowing costs]] and [[ws.ev-10y-485-30y-5307-sep9|the 30-year broke 5.3% anyway in the same session]]. **This is the most heavily deduplicated position in the book.** Its two theses load an identical driver set - `rate-path`, `monetary-credibility`, `inflation-debasement` - so every channel is shared and MAX-within-driver counts each exactly once. A naive conviction SUM would have sized this near -9%; the union sizes the force, not the mentions.

holding-nvda:
  type: fund.Holding
  heldSecurity: sec.nvda
  targetWeight: 0.0482
  holdingDirection: align.direction-long
  holdingRole: align.role-primary-vehicle
  servesThesis:
    - ws.ai-capex-cycle-with-china-tail
  holdingRationale: |
    Fifth weight at 4.82%, essentially flat against the dilution baseline despite its thesis rising 0.90 to 0.92 - because [[ca.view|the alignment]] eased it 0.92 to 0.91 as [[ws.ev-ai-complex-closes-sep9|NVIDIA finished the window flat while AMD gained 14%]]. Single-thesis holding, so no dedupe applies; its weight passes through from two distinct drivers, `ai-capex-cycle` at the dominant share and `geopolitical-conflict` carrying the China tail. It no longer sits meaningfully above [[sec.amd]] in this book, which is the correct expression of a cycle that demonstrably broadened past one supplier.

holding-amd:
  type: fund.Holding
  heldSecurity: sec.amd
  targetWeight: 0.0477
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.ai-capex-cycle-with-china-tail
  holdingRationale: |
