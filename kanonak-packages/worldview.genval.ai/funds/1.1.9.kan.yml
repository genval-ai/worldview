funds:
  type: Package
  publisher: worldview.genval.ai
  version: 1.1.9
  label: Fund data - driver-union reweight against snapshot 4.2.0 + alignments 2.0.7
  comment: >-
    Patch reweight of the public fund data, re-derived by the driver-union method from
    alignments 2.0.7 against worldview snapshot 4.2.0 (Tuesday November 24 - Democrats won
    both chambers and the defense names fell on budget fears; the October minutes, Waller
    and a certain December hike firmed the hawkish regime; Brent fell about 22% to a
    three-month low as the IEA forecast a surplus; Nvidia beat, lost and regained its CEO;
    the S&P 500 corrected with the VIX above 30, then had its best day since April 2025).
    Same seven active theses, same 24 holdings and same method as 1.1.8, so a patch with no
    turnover. The duration shorts grow as the hawkish regime firms; gold, equity and energy
    give back; net exposure falls to 74.1 percent. No securities bump.
    Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
        - package: core-kanonak
          match: ^
          version: 2.4.0
          alias: kanonak
    - publisher: worldview.genval.ai
      packages:
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: alignments
          match: '='
          version: 2.0.7
          alias: ca
        - package: securities
          match: ^
          version: 2.4.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.2.0
          alias: ws

genval-worldview-fund:
  type: fund.Fund
  label: "Genval Worldview Fund (1.1.9 - driver-union reweight against snapshot 4.2.0 and alignments 2.0.7; the duration shorts grow as a December hike is priced as certain, gold, equity and energy give back, and AI edges up as its confidence eased less than the book; 24 holdings, gross 0.9998, net 0.7412, cash 0.1295)"
  fundObservedAt: 2026-11-24T05:13:49Z
  fund.derivedFromSnapshot: ws.view
  derivedFromAlignment: ca.view
  weightingMethod: fund.method-driver-union
  grossExposure: 0.9998
  netExposure: 0.7412
  cashWeight: 0.1295
  fundNarrative: |
    Driver-union reweight from [[ca.view|alignments 2.0.7]] against [[ws.view|worldview snapshot 4.2.0]] (observedAt 2026-11-24T04:31:02Z). Same seven `wv.active` theses, the same 24 holdings and the same `fund.method-driver-union` as 1.1.8, so this is a patch with no turnover. Gross 0.9998, net 0.7412, cash 0.1295.

    **Six of seven theses eased, so most of the move is relative.** Every confidence fell except [[ws.hawkish-warsh-regime]], 0.92 to 0.94, and weights are normalised to the same gross budget, so a holding gains when its thesis eased less than the book. That is why the AI names edge up although [[ws.ai-capex-cycle-with-china-tail]] eased 0.87 to 0.82, and why energy barely moves although [[ws.persistent-energy-shock]] eased 0.91 to 0.83.

    **The duration shorts grow.** [[ws.ev-fomc-minutes-oct-further-hikes-nov18|The minutes]], [[ws.ev-waller-half-point-december-nov18|Waller's half point]] and [[ws.ev-nvda-31pct-day-dec-hike-certain-nov23|a certain December hike]] firmed the hawkish regime, and the alignment firmed short [[sec.ief]] in both rate baskets: IEF to 4.88% short and [[sec.tlt]] to 5.52% short. Duration shorts are 10.40% of gross against 9.24%.

    **Gold, equity and energy give back.** [[ws.gold-debasement-bid]] fell to 0.68 as [[ws.ev-gold-14-month-low-3739-nov18|gold reached a 14-month low]], and gold falls from 12.05% to 11.24% of gross. [[ws.equity-melt-up-vs-recession-risk]] fell to 0.60 through [[ws.ev-spx-correction-vix-above-30-nov20|the correction]], and the equity longs fall from 12.24% to 11.60%, with [[sec.uvix]] holding its weight as the alignment firmed the hedge. Energy is 22.83% against 23.21%, and [[sec.uso]] stays the largest holding at 7.18%.

    **Theme rollup by gross weight.** Energy 22.83% (USO, XLE, XOM, CVX); AI 21.11% (NVDA, AMD, AVGO, ORCL, MU); Defense 13.86% (LMT, RTX, NOC); Gold 11.24% (GLD, IAU, GDX); Equity long 11.60% (SPY, VTI, QQQ, UVIX); Equity short 2.53% (IWM); Duration shorts 10.40% (TLT, IEF); Managed futures 6.41% (DBMF, KMLM). Net 74.1%, down from 75.9% as the duration shorts grew.
  hasHolding:
    - holding-uso
    - holding-xle
    - holding-tlt
    - holding-ief
    - holding-lmt
    - holding-rtx
    - holding-gld
    - holding-nvda
    - holding-avgo
    - holding-xom
    - holding-amd
    - holding-cvx
    - holding-noc
    - holding-orcl
    - holding-mu
    - holding-iau
    - holding-dbmf
    - holding-spy
    - holding-uvix
    - holding-kmlm
    - holding-gdx
    - holding-vti
    - holding-qqq
    - holding-iwm

holding-uso:
  type: fund.Holding
  heldSecurity: sec.uso
  targetWeight: 0.0718
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.stagflation-risk
    - ws.persistent-energy-shock
  holdingRationale: |
    7.18% long, down from 7.42% (-3.2%). Both theses that hold it eased - [[ws.persistent-energy-shock]] 0.91 to 0.83 and [[ws.stagflation-risk]] 0.86 to 0.83 - and the alignment cut USO to 0.68 in the stagflation basket after [[ws.ev-iea-omr-q4-surplus-17mbd-nov13|the IEA forecast a surplus]]; it stays at the top of the book because every other thesis's weight fell with it. Driver-union dedup: `inflation-debasement` is shared, counted once at [[ws.stagflation-risk]], while its other channels add.

