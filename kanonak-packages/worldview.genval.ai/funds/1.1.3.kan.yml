  targetWeight: 0.0398
  holdingDirection: align.direction-long
  holdingRole: align.role-high-beta-proxy
  servesThesis:
    - ws.ai-capex-cycle-with-china-tail
  holdingRationale: |
    AI high-beta proxy (**3.98%**, strength 0.68) for [[ws.ai-capex-cycle-with-china-tail]] - foundry and product-turnaround optionality, held for convexity rather than fit, which is why it is the smallest of the five AI slots.

holding-vti:
  type: fund.Holding
  heldSecurity: sec.vti
  targetWeight: 0.0395
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.equity-melt-up-vs-recession-risk
  holdingRationale: |
    Equity-beta alternate (**3.95%**, strength 0.78) for [[ws.equity-melt-up-vs-recession-risk]] - total-market breadth including the mid- and small-cap records the thesis cites. Trims with its thesis.

holding-dbmf:
  type: fund.Holding
  heldSecurity: sec.dbmf
  targetWeight: 0.0385
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.hawkish-warsh-regime
    - ws.stagflation-risk
  holdingRationale: |
    Managed-futures alternate (**3.85%**, from 3.75%) serving [[ws.hawkish-warsh-regime]] and [[ws.stagflation-risk]], deduped on the same three shared drivers as the duration shorts - trend carry that harvests the rate-up regime rather than betting on it directly, with a trend-following lag. Adds slightly as the hawkish channel strengthens.

holding-uvix:
  type: fund.Holding
  heldSecurity: sec.uvix
  targetWeight: 0.0375
  holdingDirection: align.direction-long
  holdingRole: align.role-hedge
  servesThesis:
    - ws.equity-melt-up-vs-recession-risk
  holdingRationale: |
    Vol hedge (**3.75%**, from 3.59%) and the only equity-sleeve holding to grow, because [[ca.view|the alignment]] raised its strength 0.68 to 0.74 - the largest strength move in that file - against a thesis whose confidence actually fell. [[ws.ev-vix-1634-sep2|The VIX rose to 16.34 from 14.47]] while the thesis's named end-mechanism moved to roughly even money, which is when a vol hedge earns its slot. Levered decay means the fit is to the tail scenario, not to carry.

holding-kmlm:
  type: fund.Holding
  heldSecurity: sec.kmlm
  targetWeight: 0.0283
  holdingDirection: align.direction-long
  holdingRole: align.role-alternate-vehicle
  servesThesis:
    - ws.hawkish-warsh-regime
  holdingRationale: |
    Smallest weight (**2.83%**, strength 0.50) - managed-futures carry for [[ws.hawkish-warsh-regime]] with a heavier commodity sleeve than [[sec.dbmf]], which is additive in a window where the rate move and the energy move are the same story. Single-thesis, so nothing dedupes and the full confidence gain flows through.
