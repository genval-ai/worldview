  heldSecurity: sec.spy
  targetWeight: 0.0431
  holdingDirection: align.direction-long
  holdingRole: align.role-primary-vehicle
  servesThesis:
    - ws.equity-melt-up-vs-recession-risk
  holdingRationale: |
    Equity-beta primary vehicle (**4.31%**, from 4.49%, strength 0.85) for [[ws.equity-melt-up-vs-recession-risk]] (0.78, down). [[ws.ev-spy-qqq-sep2|SPY fell 0.8% to 765.16 under a record index print]] - the composition-versus-level split the thesis now turns on, and the reason its confidence eased.

holding-intc:
  type: fund.Holding
