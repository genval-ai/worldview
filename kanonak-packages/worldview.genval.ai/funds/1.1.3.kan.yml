    Energy alternate (**4.31%**, from 4.11%, strength 0.83) for [[ws.persistent-energy-shock]] - same undeduped confidence pass-through as [[sec.xom]]. A near-substitute for XOM; holding both is sector risk rather than two independent bets.

holding-spy:
