funds:
  type: Package
  publisher: worldview.genval.ai
  version: 1.1.7
  label: Fund data - driver-union reweight against snapshot 4.0.5 + alignments 2.0.5
  comment: >-
    Patch reweight of the public fund data, re-derived by the driver-union method from
    alignments 2.0.5 against worldview snapshot 4.0.5 (Thursday October 15 - September
    payrolls +29,000 with 4.2% unemployment against a 3.7% CPI; August core PCE 3.0% and
    October hike odds near a third; the 10Y at a 24-year high near 5.35% on October 7;
    Trump rejected the seven-day Hormuz plan and pledged no strikes before the midterms
    while the Saudi pipeline returned to 5.8 mb/d; Micron beat by $4B as the AI complex
    fell on financing worries). Same seven active theses, same 24 holdings and same method
    as 1.1.6, so a patch with no turnover. Energy pulls ahead of AI as the producers gain,
    the AI sleeve trims ORCL and AMD, the IEF short shrinks, and the UVIX hedge and IWM
    short grow; net exposure is flat at 75.0 percent. No securities bump.
    Superseded by the next operator refresh.
  imports:
    - publisher: kanonak.org
      packages:
        - package: core-rdf
          match: ^
          version: 1.1.0
          alias: rdfs
    - publisher: worldview.genval.ai
      packages:
        - package: fund
          match: ^
          version: 1.0.0
          alias: fund
        - package: alignment
          match: ^
          version: 1.0.0
          alias: align
        - package: alignments
          match: '='
          version: 2.0.5
          alias: ca
        - package: securities
          match: ^
          version: 2.4.0
          alias: sec
        - package: snapshots
          match: '='
          version: 4.0.5
          alias: ws

genval-worldview-fund:
  type: fund.Fund
  label: "Genval Worldview Fund (1.1.7 - driver-union reweight against snapshot 4.0.5 and alignments 2.0.5; energy pulls ahead of AI as the producers gain and the Hormuz plan is rejected, the AI sleeve trims ORCL and AMD on financing, the IEF short shrinks with the October hike, and the UVIX hedge and IWM short grow; 24 holdings, gross 0.9998, net 0.7504, cash 0.1249)"
  fundObservedAt: 2026-10-15T18:58:57Z
  fund.derivedFromSnapshot: ws.view
  derivedFromAlignment: ca.view
  weightingMethod: fund.method-driver-union
  grossExposure: 0.9998
  netExposure: 0.7504
  cashWeight: 0.1249
  fundNarrative: |
    Driver-union reweight from [[ca.view|alignments 2.0.5]] against [[ws.view|worldview snapshot 4.0.5]] (observedAt 2026-10-15T18:42:57Z). Same seven `wv.active` theses, the same 24 holdings and the same `fund.method-driver-union` as 1.1.6, so this is a patch with no turnover. Gross 0.9998, net 0.7504, cash 0.1249.

    **Energy pulls ahead of AI again.** The two themes were level at 1.1.6; now energy is 22.86% against 21.71% and AI 21.08% against 21.69%. [[ws.persistent-energy-shock]] firmed 0.86 to 0.88 as [[ws.ev-trump-rejects-seven-day-plan-sep|the Hormuz reopening plan was rejected]], and the alignment shifted weight from the commodity to the producers after [[ws.ev-energy-equities-oct14|XLE, XOM and CVX rose 8-9% while USO was flat]] - [[sec.xle]] gains 7.2% to 7.18%, four basis points behind [[sec.uso]] at 7.22%. [[ws.ai-capex-cycle-with-china-tail]] eased 0.92 to 0.89 on [[ws.ev-chip-rout-ai-financing-oct14|an AI-financing rout]] despite [[ws.ev-micron-fq4-542b-guide-615b-sep30|Micron's record quarter]].

    **The AI sleeve is sorted by financing.** [[sec.orcl]] is the largest AI trim, -6.9% to 3.77%, and [[sec.amd]] -4.1% to 4.48%, while [[sec.avgo]] and [[sec.mu]] are near-flat because the alignment firmed them against the thesis step. The book's AI exposure now leans toward the cash-generative leaders.

    **The rate shorts shrink at the belly.** [[sec.ief]] falls -3.6% to -4.30% as [[ws.ev-oct-hike-odds-35pct-sep30|the October hike receded to about a third]], while [[sec.tlt]] is near-flat at -5.21%: [[ws.hawkish-warsh-regime]] eased 0.94 to 0.91 but [[ws.stagflation-risk]] firmed 0.86 to 0.89. Their shared `rate-path` and `monetary-credibility` channels are counted once at the regime thesis and `inflation-debasement` once at stagflation.

    **The equity sleeve leans into its two-sided legs.** [[ws.equity-melt-up-vs-recession-risk]] held at 0.70, and the alignment firmed the [[sec.uvix]] hedge (4.0% to 3.12%) and the short [[sec.iwm]] (4.2% to -2.96%) while easing [[sec.qqq]] - the legs that paid in a window that came within two sessions of the melt-up leg and then sold off on CPI.

    **Defense and gold trim on their theses.** [[ws.iran-war-rearmament]] eased to 0.86 on [[ws.ev-trump-no-strikes-before-midterms-oct8|the pre-midterm strike pause]] and [[ws.gold-debasement-bid]] to 0.82; [[sec.gdx]] takes the largest cut in the gold sleeve, -6.1% to 3.38%, after [[ws.ev-gld-gdx-oct14|falling 9.7% against bullion's 4.0%]].

    **Theme rollup by gross weight.** Energy 22.86% (USO, XLE, XOM, CVX); AI 21.08% (NVDA, AMD, AVGO, MU, ORCL); Defense 12.80% (LMT, RTX, NOC); Gold 12.67% (GLD, IAU, GDX); Equity long 12.37% (SPY, VTI, QQQ, UVIX); Equity short 2.96% (IWM); Duration shorts 9.51% (TLT, IEF); Managed futures 5.73% (DBMF, KMLM). Net 75.0%, essentially unchanged from 74.9%.
  hasHolding:
    - holding-uso
    - holding-xle
    - holding-gld
    - holding-tlt
    - holding-nvda
    - holding-amd
    - holding-lmt
    - holding-avgo
    - holding-ief
    - holding-xom
    - holding-rtx
    - holding-cvx
    - holding-noc
    - holding-iau
    - holding-mu
    - holding-orcl
    - holding-spy
    - holding-gdx
    - holding-uvix
    - holding-dbmf
    - holding-vti
    - holding-iwm
    - holding-qqq
    - holding-kmlm

