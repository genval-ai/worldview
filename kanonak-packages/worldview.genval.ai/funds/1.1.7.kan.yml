  holdingRationale: |
    7.22% long, up from 7.00% (3.1%). The energy thesis firmed 0.86 to 0.88 as [[ws.ev-trump-rejects-seven-day-plan-sep|the seven-day Hormuz plan was rejected]]; the alignment eased USO to 0.86 after [[ws.ev-energy-equities-oct14|it lagged the producers' re-rating]], so its gain is smaller than XLE's. Driver-union dedup: `inflation-debasement` is shared, counted once at [[ws.stagflation-risk]], while its other channels add.

